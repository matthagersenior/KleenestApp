name: Kleenest Active Runtime Gate
on:
  push:
    branches: [refactor/monolith-removal]
  pull_request:
    branches: [refactor/monolith-removal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical runtime syntax
        run: |
          set -euo pipefail
          files=(kleenest-modular-shell-v13.js kleenest-home-core-v1.js kleenest-home-checkin-bridge-v1.js kleenest-qr.js kleenest-account-plans-v1.js kleenest-business-feature-entitlement-enforcer-v2.js kleenest-business-studio-entitlement-guard-v1.js kleenest-business-workspace-v1.js kleenest-business-gap-closer-v2.js kleenest-business-control-center-v5.js kleenest-fleet-workspace-v1.js kleenest-qr-studio-dashboard-v1.js kleenest-admin-canonical-runtime-v3.js kleenest-admin-tools-dashboard-v3.js kleenest-platform-admin-core-v4.js kleenest-data-feature-wiring-v1.js kleenest-location-contribution-bridge-v1.js kleenest-location-details-v1.js kleenest-game-engine-v1.js kleenest-rewards.js kleenest-reviews.js kleenest-promotions.js core/kleenest-tab-core-registry-v2.js cores/home/home-core.js cores/maps/maps-tab-core-v2.js cores/maps/maps-core.js cores/maps/maps-renderer-v2.js cores/business/business-core-v8.js cores/admin/admin-core.js); for f in "${files[@]}"; do test -f "$f"; node --check "$f"; done
      - name: Check known contracts
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude='*.md' 'qr_codes\.business_id' .
          ! grep -RIn --include='*.js' -E 'alert\([^)]*(upgrade|premium|tier|plan|locked|requires)' kleenest-business-feature-entitlement-enforcer-v*.js
          grep -q 'refactor/monolith-removal' .github/workflows/jekyll-gh-pages.yml
