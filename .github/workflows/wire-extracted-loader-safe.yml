name: Wire extracted modules safely
on:
  push:
    branches: [refactor/monolith-removal]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loader without replacing index
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -s kleenest-extracted-modules.js
          python3 - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text(encoding='utf-8')
loader='<script src="kleenest-extracted-modules.js"></script>'
if loader not in s:
    marker='</body>'
    if marker not in s:
        raise SystemExit('index.html has no </body>; refusing to modify entrypoint')
    s=s.replace(marker, loader+'\n'+marker, 1)
    p.write_text(s,encoding='utf-8')
PY
      - name: Verify entrypoint preservation
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'kleenest-extracted-modules.js' index.html
          grep -q '</html>' index.html
          node --check kleenest-extracted-modules.js
      - name: Commit only the additive wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire extracted modules without replacing index'
          git push
