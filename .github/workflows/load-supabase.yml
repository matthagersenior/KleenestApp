name: Load Supabase integration

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'supabase-client.js'
      - 'kleenest-supabase-runtime.js'
      - '.github/workflows/load-supabase.yml'

permissions:
  contents: write

jobs:
  inject-supabase-scripts:
    if: !contains(github.event.head_commit.message, '[supabase-injected]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase scripts into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',
              '<script src="supabase-client.js"></script>',
              '<script src="kleenest-supabase-runtime.js"></script>',
          ]
          missing = [tag for tag in tags if tag not in text]
          if missing:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('index.html has no </head> marker')
              text = text.replace(marker, '\n'.join(missing) + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit injected scripts
        run: |
          if git diff --quiet -- index.html; then
            echo 'Supabase scripts already loaded.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Supabase integration scripts [supabase-injected]'
          git push
