<script>
/* ========== DATA LAYER (localStorage "database") ========== */
const DB = {
  key: 'kleenest-db-v11',
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) {
        const data = JSON.parse(raw);
        const defaults = this.defaults();
        if (!data.users) data.users = [];
        if (!data.restrooms) data.restrooms = defaults.restrooms;
        if (!data.reviews) data.reviews = {};
        if (!data.activity) data.activity = [];
        if (!data.follows) data.follows = {};
        if (!data.messages) data.messages = [];
        if (!data.socialPosts) data.socialPosts = [];

const CHAIN_BRAND_KEYS = Object.keys(BRAND_PROFILES);

function lookupBrandProfile(nameOrBrand) {
  if (!nameOrBrand) return null;
  const key = String(nameOrBrand).toLowerCase().trim().replace(/\s+/g, ' ').replace(/[®™]/g, '');
  if (BRAND_PROFILES[key]) return BRAND_PROFILES[key];
  for (const k of CHAIN_BRAND_KEYS) {
    if (key.includes(k) || k.includes(key)) return BRAND_PROFILES[k];
  }
  return null;
}

/** Helper to build a municipal restroom record from flexible field maps */
function muniRecord(opts) {
  const { id, name, address, lat, lng, accessible, changing, hours, owner, placeType, sourceName } = opts;
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  return {
    id, name: name || 'Public Restroom', address: address || sourceName || 'Municipal',
    lat, lng, rating: 0, distance: '—', isPremium: false,
    accessible: !!accessible, changing: !!changing, verified: true,
    cleanliness: 'good', cleanlinessPct: 0, lastCleanedTime: 0,
    amenities: ['Mapped restroom', ...(accessible ? ['Accessible Stall'] : []), ...(changing ? ['Baby Changing'] : [])],
    hours: { open: hours || 'See posted hours', close: '' }, reviews: 0, businessPhone: '',
    owner: owner || sourceName || 'Municipality', ownerEmail: null, verificationStatus: 'unrated',
    placeType: placeType || 'public', restroomConfidence: 'confirmed',
    source: 'municipal', municipalSource: sourceName || 'Open data'

// Countable fixtures — quantities a business can customize (things a bathroom can have more than one of)
const FIXTURE_TYPES = [
  {key:'stalls', label:'Stalls', icon:'🚻'},
  {key:'urinals', label:'Urinals', icon:'🚹'},
  {key:'toilets', label:'Toilets', icon:'🚽'},
  {key:'sinks', label:'Sinks', icon:'🚰'},
  {key:'mirrors', label:'Mirrors', icon:'🪞'},
  {key:'dryers', label:'Hand Dryers', icon:'💨'},
  {key:'paperTowelDispensers', label:'Paper Towel Dispensers', icon:'🧻'},
  {key:'soapDispensers', label:'Soap Dispensers', icon:'🧴'},
  {key:'trashBins', label:'Trash Bins', icon:'🗑️'},
  {key:'changingTables', label:'Changing Tables', icon:'👶'},
  {key:'showerStalls', label:'Shower Stalls', icon:'🚿'},
  {key:'lockers', label:'Lockers', icon:'🔒'}
];
function defaultFixtureCounts() {
  const o = {}; FIXTURE_TYPES.forEach(f => o[f.key] = 0); return o;
}
// Best-guess starter counts by place type, only used the first time a listing is normalized
function estimateFixtureCounts(r) {
  const o = defaultFixtureCounts();
  const big = ['mall','travel','hospital','transit'].includes(r.placeType);
  const med = ['retail','fitness','education','government'].includes(r.placeType);
  o.stalls = big ? 6 : med ? 3 : 2;
  o.urinals = (r.placeType === 'travel' || r.placeType === 'transit' || r.placeType === 'mall') ? (big ? 4 : 2) : (med ? 1 : 0);
  o.toilets = o.stalls;
  o.sinks = big ? 5 : med ? 3 : 2;
  o.mirrors = Math.max(1, Math.round(o.sinks * 0.7));
  o.dryers = Math.max(1, Math.round(o.sinks / 2));
  o.paperTowelDispensers = (r.amenities||[]).includes('Paper Towels') ? Math.max(1, Math.round(o.sinks / 2)) : 0;
  o.soapDispensers = (r.amenities||[]).includes('Soap') ? o.sinks : 0;
  o.trashBins = Math.max(1, Math.round(o.sinks / 2));
  o.changingTables = (r.amenities||[]).includes('Baby Changing') ? 1 : 0;
  o.showerStalls = (r.amenities||[]).includes('Showers') ? 2 : 0;
  o.lockers = (r.amenities||[]).includes('Lockers') ? 12 : 0;
  return o;
}
function restroomCapacity(r) {
  const fc = r.fixtureCounts || {};
  return (fc.stalls||0) + (fc.urinals||0);
}
function activeSessions(r) {
  return (r.accessSessions || []).filter(s => !s.endedAt);
}
function occupancyStatus(r) {
  const cap = restroomCapacity(r);
  const active = activeSessions(r).length;
  if (!cap) return {label:'Unknown', cls:'unknown', pct:0};
  const pct = Math.min(100, Math.round((active / cap) * 100));
  if (active <= 0) return {label:'Open — nobody checked in', cls:'open', pct};
  if (pct < 100) return {label:'Partially occupied', cls:'partial', pct};
  return {label:'At capacity', cls:'full', pct};
}
function normalizeGeoFeatures(list) {
  (list || []).forEach(r => {
    if (!r.fixtureCounts) r.fixtureCounts = estimateFixtureCounts(r);
    else { const d = defaultFixtureCounts(); Object.keys(d).forEach(k => { if (r.fixtureCounts[k] == null) r.fixtureCounts[k] = d[k]; }); }
    if (!r.geofence) r.geofence = { radiusM: 45 };
    if (r.smartBathroom == null) r.smartBathroom = false;
    if (!r.rentalPasses) r.rentalPasses = [];
    if (!r.accessSessions) r.accessSessions = [];
  });
}
function checkGeofence(r) {
  return window.KleenestLocation?.checkGeofence
    ? window.KleenestLocation.checkGeofence(r)
    : Promise.resolve({ok:false, reason:'Location controller is not ready.'});
}
function genPassCode(prefix) {
  return (prefix||'K') + '-' + Math.random().toString(36).slice(2,7).toUpperCase();
}
function generateRentalPass(r, price, label) {
  const pass = {code: genPassCode('R'), price: Number(price)||0, label: label||'Single-use access', status:'unused', createdAt: Date.now(), usedBy:null, usedAt:null, kind:'rental'};
  r.rentalPasses.push(pass);
  save();
  return pass;
}
function buyPremiumUse(r, user) {
  const pass = {code: genPassCode('PU'), price: 0, label:'Premium single-use', status:'unused', createdAt: Date.now(), usedBy:null, usedAt:null, kind:'premium-use', ownerId: user.id};
  r.rentalPasses.push(pass);
  save();
  return pass;
}
function redeemPass(r, code, user) {
  const pass = (r.rentalPasses || []).find(p => p.code === (code||'').trim().toUpperCase() && p.status === 'unused');
  if (!pass) return null;
  pass.status = 'used'; pass.usedBy = user ? user.id : 'guest'; pass.usedAt = Date.now();
  const session = {id:'as'+Date.now(), userId: user ? user.id : 'guest', startedAt: Date.now(), endedAt: null, via: pass.kind, passCode: pass.code};
  r.accessSessions.push(session);
  save();
  return session;
}
function startVisitSession(r, user) {
  let session = activeSessions(r).find(s => s.userId === user.id);
  if (session) return session;
  session = {id:'as'+Date.now(), userId: user.id, startedAt: Date.now(), endedAt: null, via:'checkin-out'};
  r.accessSessions.push(session);
  save();
  return session;
}
function endVisitSession(r, user) {
  const session = activeSessions(r).find(s => s.userId === user.id);
  if (session) { session.endedAt = Date.now(); save(); }
  return session;
}

function recordScan(id, source) {

async function scanQR() {
  const user = currentUser();
  if (!user) { alert('Please log in to scan and check in.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const code = prompt('Enter the QR check-in code (example: r1):');
    if (code) handleCode(code);
    return;
  }
  if (!('BarcodeDetector' in window)) {
    const code = prompt('QR camera scanning is not supported by this browser. Enter the QR code ID (example: r1):');
    if (code) handleCode(code);
    return;
  }
  const modal = document.createElement('div');
  modal.className = 'scan-modal';
  modal.innerHTML = '<div class="scan-panel"><button class="btn btn-ghost btn-sm scan-close">Close</button><h3 style="margin:8px 0">Scan Kleenest QR</h3><video autoplay playsinline></video><p class="profile-sub" style="margin-top:8px">Point your camera at the business QR code.</p></div>';
  document.body.appendChild(modal);
  const video = modal.querySelector('video');
  let stream; let stopped = false;
  modal.querySelector('.scan-close').onclick = () => { stopped = true; if (stream) stream.getTracks().forEach(t => t.stop()); modal.remove(); };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    video.srcObject = stream;
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      if (stopped) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) { handleCode(codes[0].rawValue); modal.querySelector('.scan-close').click(); return; }
      } catch (e) {}
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    modal.remove();
    const code = prompt('Camera unavailable. Enter the QR check-in code (example: r1):');
    if (code) handleCode(code);
  }
}

function handleCode(raw) {
  // Single-use / rental pass links: ?use=<restroomId>:<code>
  try {
    const u = new URL(raw);
    const usePart = u.searchParams.get('use');
    if (usePart) {
      const [rid, code] = usePart.split(':');
      const rr = state.restrooms.find(x => x.id === rid);
      const user = currentUser();
      if (!user) { alert('Please log in to redeem a pass.'); return; }
      if (!rr) { alert('Unknown location for this pass.'); return; }
      const session = redeemPass(rr, code, user);
      if (session) { alert(`✓ Pass redeemed — checked in at ${rr.name}!`); selected = rr; tab = 'Details'; render(); }
      else alert('That pass code is invalid or already used.');
      return;
    }
  } catch (e) {}
  let id = raw;
  try { const u = new URL(raw); id = u.searchParams.get('checkin') || raw; } catch (e) {}
  const r = recordScan(id, 'qr');
  if (r) {
    alert(`✓ Checked in at ${r.name}!`);
    selected = r;
    tab = 'Details';
    render();
  } else {
    alert('That QR code is not a valid Kleenest business code, or you need to log in first.');
  }
}

}

function businessPartnerTier(userOrRestroom) {
  // From business user or from restroom owner
  if (!userOrRestroom) return 'standard';
  if (userOrRestroom.businessTier) return userOrRestroom.businessTier === 'enterprise' ? 'enterprise' : userOrRestroom.businessTier === 'growth' ? 'growth' : 'standard';
  if (userOrRestroom.ownerId) {
    const owner = state.users.find(u => u.id === userOrRestroom.ownerId);
    if (owner) return businessPartnerTier(owner);
  }
  // Multi-location listings often imply Growth
  const owner = state.users.find(u => (u.businessLocationIds || []).includes(userOrRestroom.id) || u.businessRestroomId === userOrRestroom.id);
  if (owner) return businessPartnerTier(owner);
  return userOrRestroom.isPremium ? 'growth' : 'standard';
}

/**
 * Matching partner benefits: Premium/Fleet/Enterprise travelers ↔ Business/Growth/Enterprise venues
 * Returns null if user is free or not eligible.
 */
function partnerBenefitsFor(user, restroom) {
  const cTier = consumerPartnerTier(user);
  if (!cTier) return null;
  const bTier = businessPartnerTier(restroom);
  // Base matrix (discount % + access label)
  const matrix = {
    premium: {
      standard: { discountPct: 5, access: 'Preferred check-in', perks: ['Skip the guest list at partner venues', 'Member rate on day-use passes'] },
      growth: { discountPct: 10, access: 'Priority access', perks: ['Priority queue for restroom check-in', 'Early event RSVP', 'Member promo stacking'] },
      enterprise: { discountPct: 15, access: 'VIP partner access', perks: ['VIP lane / preferred stalls when available', 'Complimentary timed-promo boost', 'Concierge support note on check-in'] }
    },
    fleet: {
      standard: { discountPct: 8, access: 'Fleet preferred', perks: ['Driver priority check-in', 'Multi-member recognition', 'Fleet rate on passes'] },
      growth: { discountPct: 12, access: 'Fleet priority', perks: ['Priority for whole fleet roster', 'Bulk pass pricing', 'Route-friendly partner routing'] },
      enterprise: { discountPct: 18, access: 'Fleet VIP', perks: ['VIP access for all rostered drivers', 'Dedicated partner liaison', 'Co-branded rest-stop perks'] }
    },
    enterprise: {
      standard: { discountPct: 10, access: 'Enterprise preferred', perks: ['Org-wide preferred access', 'Invoice-friendly passes', 'Priority support'] },
      growth: { discountPct: 15, access: 'Enterprise priority', perks: ['Org roster recognition', 'Custom event blocks', 'Stacked Growth promos'] },
      enterprise: { discountPct: 20, access: 'Enterprise ↔ Enterprise VIP', perks: ['Mutual VIP access', 'Cooperative service credits', 'Joint SLA-style support', 'Cross-promo on both networks'] }
    }
  };
  const base = (matrix[cTier] && matrix[cTier][bTier]) || matrix.premium.standard;
  // Location-level overrides from partnerProgram
  ensurePartnerProgram(restroom);
  const prog = restroom.partnerProgram;
  const extra = [];
  if (prog.preferredAccess) extra.push('Venue-enabled preferred access');
  if (prog.customPerk) extra.push(prog.customPerk);
  if (prog.matchDiscountBonus) base.discountPct = Math.min(30, base.discountPct + prog.matchDiscountBonus);
  // Cooperative agreements with other businesses
  const coops = (prog.coopAgreements || []).map(a => a.label || a.partnerName).filter(Boolean);
  return {
    consumerTier: cTier,
    businessTier: bTier,
    discountPct: base.discountPct,
    access: base.access,
    perks: [...base.perks, ...extra],
    coops,
    programActive: prog.enabled !== false
  };
}

function levelFromPoints(pts) {
  // Level 1: 0-49, 2: 50-149, 3: 150-299, then +1 per 200 pts
  if (pts < 50) return 1;
  if (pts < 150) return 2;
  if (pts < 300) return 3;
  return 3 + Math.floor((pts - 300) / 200) + 1;
}

function pointsMultiplier(user) {
  if (!user) return 1;
  let m = 1;
  if (user.subscriptionLevel === 'Enterprise' || user.businessTier === 'enterprise') m *= 2.0; // Enterprise: +100%
  else if (user.subscriptionLevel === 'Fleet') m *= 1.75; // Fleet/group: +75%
  else if (isPremiumUser(user)) m *= 1.5; // Premium / Business: +50%
  if ((user.streak || 0) >= 7) m *= 1.25;
  else if ((user.streak || 0) >= 3) m *= 1.1;
  return m;
}

/** Average cleanliness of locations owned by a business user */
function businessCleanScore(user) {
  if (!user || !user.isBusinessUser) return 0;
  const ids = user.businessLocationIds || (user.businessRestroomId ? [user.businessRestroomId] : []);
  const places = ids.map(id => state.restrooms.find(r => r.id === id)).filter(Boolean);
  if (!places.length) return 0;
  const sum = places.reduce((s, r) => s + (r.cleanlinessPct || (r.rating ? r.rating * 20 : 0)), 0);
  return Math.round(sum / places.length);
}

function businessAvgRating(user) {
  if (!user || !user.isBusinessUser) return 0;
  const ids = user.businessLocationIds || (user.businessRestroomId ? [user.businessRestroomId] : []);
  const places = ids.map(id => state.restrooms.find(r => r.id === id)).filter(r => r && r.rating);
  if (!places.length) return 0;
  return +(places.reduce((s, r) => s + r.rating, 0) / places.length).toFixed(2);
}

function tournamentScore(user) {
  if (!user) return 0;
  // Weighted blend for weekly tournament ranking
  return (user.totalCheckIns || 0) * 2 + (user.totalReviews || 0) * 3 + Math.floor((user.points || 0) / 20) + (user.streak || 0) * 2 + ((user.gameStats && user.gameStats.duelWins) || 0) * 5;
}

function topBusinesses(limit) {
  return state.users
    .filter(u => u.isBusinessUser && !u.isAdmin)
    .map(u => ({
      u,
      clean: businessCleanScore(u),
      rating: businessAvgRating(u),
      replies: u.totalReplies || 0,
      locs: (u.businessLocationIds || (u.businessRestroomId ? [u.businessRestroomId] : [])).length
    }))
    .filter(x => x.locs > 0)
    .sort((a, b) => b.clean - a.clean || b.rating - a.rating || b.replies - a.replies)
    .slice(0, limit || 8);
}

function grantPoints(user, base, reason) {
  if (!user) return 0;
  const earned = Math.round(base * pointsMultiplier(user));
  user.points = (user.points || 0) + earned;
  user.level = levelFromPoints(user.points);
  awardBadges(user);
  return earned;
}

function updateStreak(user) {
  if (!user) return;
  const today = new Date().toISOString().slice(0, 10);
  if (user.lastCheckInDay === today) return; // already checked in today
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (user.lastCheckInDay === yesterday) {
    user.streak = (user.streak || 0) + 1;
  } else {
    user.streak = 1;
  }
  user.lastCheckInDay = today;
  if (user.streak >= 3) awardBadges(user);
}

function awardBadges(user) {
  if (!user) return;
  user.badges = user.badges || [];
  const add = (b) => { if (!user.badges.includes(b)) { user.badges.push(b); return true; } return false; };
  if ((user.totalCheckIns || 0) >= 1) add('First Check-in');
  if ((user.totalCheckIns || 0) >= 10) add('Regular');
  if ((user.totalCheckIns || 0) >= 50) add('Trailblazer');
  if ((user.totalReviews || 0) >= 1) add('First Review');
  if ((user.totalReviews || 0) >= 5) add('5-Star Reviewer');
  if ((user.totalReviews || 0) >= 25) add('Critic');
  if ((user.following || []).length >= 3) add('Social Butterfly');
  if ((user.points || 0) >= 100) add('Point Collector');
  if ((user.points || 0) >= 500) add('High Scorer');
  if ((user.streak || 0) >= 3) add('On a Roll');
  if ((user.streak || 0) >= 7) add('Week Warrior');
  if ((user.level || 1) >= 5) add('Level 5');
  if (isPremiumUser(user)) {
    add('Premium Member');
    if ((user.points || 0) >= 200) add('Premium Elite');
    if ((user.totalReviews || 0) >= 3) add('Photo Reviewer');
  }
}

function distanceMiles(lat1, lon1, lat2, lon2) {
  const R = 3958.7613, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateDistances(lat, lon) {
  state.restrooms.forEach(r => {
    if (typeof r.lat === 'number' && typeof r.lng === 'number') {
      r._distance = distanceMiles(lat, lon, r.lat, r.lng);
      r.distance = r._distance < 0.1 ? '<0.1 mi' : r._distance.toFixed(1) + ' mi';
    }
  });
  state.restrooms.sort((a,b) => (a._distance ?? 999999) - (b._distance ?? 999999));
  // Do not save() here — distances are ephemeral; avoids writing session layers
}

function contestScore(user, metric) {
  if (!user) return 0;
  // Prefer post-join contest tallies when available (anti-cheat)
  const tallies = user.contestTallies || {};
  if (metric === 'checkins') return tallies.checkins != null ? tallies.checkins : (user.totalCheckIns || 0);
  if (metric === 'reviews' || metric === 'photoReviews') return tallies.reviews != null ? tallies.reviews : (user.totalReviews || 0);
  if (metric === 'points') return tallies.pointsEarned != null ? tallies.pointsEarned : (user.points || 0);
  if (metric === 'firstReviews') return tallies.firstReviews != null ? tallies.firstReviews : (user.firstReviews || 0);
  if (metric === 'replies') return tallies.replies != null ? tallies.replies : (user.totalReplies || 0);
  if (metric === 'favorites') return tallies.favorites != null ? tallies.favorites : (user.favorites || []).length;
  if (metric === 'bizClean') return businessCleanScore(user);
  if (metric === 'multiLoc') return (user.businessLocationIds || (user.businessRestroomId ? [user.businessRestroomId] : [])).length;
  return 0;
}

function ensureAntiCheat(user) {
  if (!user) return;
  if (!user.actionLog) user.actionLog = []; // {t, type}
  if (!user.contestTallies) user.contestTallies = { checkins: 0, reviews: 0, firstReviews: 0, replies: 0, pointsEarned: 0, favorites: 0 };
  if (user.contestTallies.favorites == null) user.contestTallies.favorites = 0;
  if (!user.joinedContests) user.joinedContests = {}; // id -> joinedAt
  if (!user.claimedContestIds) user.claimedContestIds = [];
}

// Anti-cheat: rate limits + cooldown + diversity checks
function recordContestAction(user, type, ptsEarned) {
  if (!user) return { ok: true };
  ensureAntiCheat(user);
  const now = Date.now();
  user.actionLog.push({ t: now, type });
  // Keep last 2 hours only
  user.actionLog = user.actionLog.filter(a => now - a.t < 2 * 3600000);

  const last5min = user.actionLog.filter(a => now - a.t < 5 * 60000 && a.type === type);
  const lastHour = user.actionLog.filter(a => now - a.t < 3600000 && a.type === type);
  const limits = {
    checkin: { per5: 3, perHour: 12 },
    review: { per5: 2, perHour: 8 },
    reply: { per5: 5, perHour: 20 },
    report: { per5: 3, perHour: 10 },
    favorite: { per5: 10, perHour: 30 }
  };
  const lim = limits[type] || { per5: 5, perHour: 20 };
  if (last5min.length > lim.per5) {
    return { ok: false, reason: 'Too many actions in a short time. Slow down and try again in a few minutes.' };
  }
  if (lastHour.length > lim.perHour) {
    return { ok: false, reason: 'Hourly action limit reached for contest fairness. Try again later.' };
  }

  // Only count toward contests the user has joined
  const joinedAny = Object.keys(user.joinedContests || {}).length > 0;
  if (joinedAny) {
    if (type === 'checkin') user.contestTallies.checkins = (user.contestTallies.checkins || 0) + 1;
    if (type === 'review') user.contestTallies.reviews = (user.contestTallies.reviews || 0) + 1;
    if (type === 'firstReview') user.contestTallies.firstReviews = (user.contestTallies.firstReviews || 0) + 1;
    if (type === 'reply') user.contestTallies.replies = (user.contestTallies.replies || 0) + 1;
    if (type === 'favorite') user.contestTallies.favorites = (user.favorites || []).length;
    if (ptsEarned) user.contestTallies.pointsEarned = (user.contestTallies.pointsEarned || 0) + ptsEarned;
  }
  return { ok: true };
}

function canClaimContest(user, contest) {
  ensureAntiCheat(user);
  if ((user.claimedContestIds || []).includes(contest.id)) {
    return { ok: false, reason: 'You already claimed this contest prize.' };
  }
  if (!user.joinedContests || !user.joinedContests[contest.id]) {
    return { ok: false, reason: 'Join the contest before claiming a prize.' };
  }
  const joinedAt = user.joinedContests[contest.id];
  if (Date.now() - joinedAt < 60 * 1000) {
    return { ok: false, reason: 'Anti-cheat: wait at least 1 minute after joining before claiming (demo rule).' };
  }
  const score = contestScore(user, contest.metric);
  if (score < contest.minScore) {
    return { ok: false, reason: `Need a contest score of ${contest.minScore}+ (you have ${score}). Scores count actions after you join.` };
  }
  // Diversity: at least 2 distinct action types in log if claiming high-value prizes
  if ((contest.prizeValue || 0) >= 25) {
    const types = new Set((user.actionLog || []).map(a => a.type));
    if (types.size < 2) {
      return { ok: false, reason: 'Anti-cheat: higher-value prizes need varied activity (e.g. check-in + review).' };
    }
  }
  return { ok: true, score };
}

function socialLeaderboardsHtml(user, premium) {
  const limit = premium || !user ? 10 : 5;
  const consumers = state.users.filter(u => !u.isBusinessUser || u.isAdmin);
  const businesses = state.users.filter(u => u.isBusinessUser && !u.isAdmin);
  const byPoints = [...consumers].sort((a,b) => (b.points||0)-(a.points||0));
  const byStreak = [...consumers].sort((a,b) => (b.streak||0)-(a.streak||0) || (b.points||0)-(a.points||0));

function ensureGameStats(user) {
  if (!user) return;
  if (!user.gameStats) user.gameStats = { quizHigh: 0, triviaHigh: 0, spins: 0, matches: 0, dailyQuizDate: null, kudosGiven: 0, kudosReceived: 0 };
  return user.gameStats;
}

function grantGamePoints(user, base, reason) {
  if (!user) return 0;
  const pts = grantPoints(user, base);
  pushActivity({ type: 'badge', userId: user.id, user: user.name, text: reason + ` (+${pts} pts)` });
  save();
  return pts;
}

function startQuizGame(mode) {
  const bank = mode === 'trivia' ? TRIVIA_BANK : QUIZ_BANK;
  const shuffled = [...bank].sort(() => Math.random() - 0.5).slice(0, 5);
  gameState = {
    type: mode === 'trivia' ? 'trivia' : 'quiz',
    questions: shuffled,
    index: 0,
    score: 0,
    finished: false
  };
}

function answerQuiz(choiceIdx) {
  if (!gameState || gameState.finished) return;
  if (gameState.type !== 'quiz' && gameState.type !== 'trivia' && gameState.type !== 'duel' && gameState.type !== 'biz-ops') return;
  const q = gameState.questions[gameState.index];
  if (!q) return;
  if (choiceIdx === q.a) gameState.score++;
  gameState.index++;
  if (gameState.index >= gameState.questions.length) {
    gameState.finished = true;
    const user = currentUser();
    if (user) {
      const gs = ensureGameStats(user);
      if (gameState.type === 'duel') {
        const win = gameState.score > gameState.oppScore;
        const tie = gameState.score === gameState.oppScore;
        gameState.outcome = win ? 'Victory!' : tie ? 'Draw' : 'Defeat';
        if (win) {
          gs.duelWins = (gs.duelWins || 0) + 1;
          gameState.earned = grantGamePoints(user, 20 + gameState.score * 2, `won a Clean Duel vs ${gameState.opponentName}`);
          if (!(user.badges || []).includes('Duel Champion')) {
            user.badges = user.badges || [];
            user.badges.push('Duel Champion');
          }
        } else if (tie) {
          gameState.earned = grantGamePoints(user, 8, `drew a Clean Duel vs ${gameState.opponentName}`);
        } else {
          gs.duelLosses = (gs.duelLosses || 0) + 1;
          gameState.earned = grantGamePoints(user, 4, `fought a Clean Duel vs ${gameState.opponentName}`);
        }
        pushActivity({
          type: 'challenge',
          userId: user.id,
          user: user.name,
          text: `${gameState.outcome === 'Victory!' ? 'won' : gameState.outcome === 'Draw' ? 'drew' : 'lost'} a Clean Duel vs ${gameState.opponentName} (${gameState.score}-${gameState.oppScore})`
        });
      } else if (gameState.type === 'biz-ops') {
        gameState.earned = grantGamePoints(user, 5 + gameState.score * 4, `scored ${gameState.score}/5 on Business Ops Challenge`);
        if (gameState.score === 5 && !(user.badges || []).includes('Ops Expert')) {
          user.badges = user.badges || [];
          user.badges.push('Ops Expert');
        }
      } else {
        const earned = grantGamePoints(user, 2 + gameState.score * 3, `scored ${gameState.score}/5 on ${gameState.type}`);
        if (gameState.type === 'quiz') gs.quizHigh = Math.max(gs.quizHigh || 0, gameState.score);
        else gs.triviaHigh = Math.max(gs.triviaHigh || 0, gameState.score);
        if (gameState.score === 5 && !(user.badges || []).includes('Quiz Whiz')) {
          user.badges = user.badges || [];
          user.badges.push('Quiz Whiz');
        }
        gameState.earned = earned;
      }
      save();
    }
  }
}

function startMatchGame() {
  const icons = ['🧼','🚽','🧻','🧴','♿','⭐','📍','🔥'];
  const pair = [...icons, ...icons].sort(() => Math.random() - 0.5).map((icon, i) => ({ id: i, icon, flipped: false, matched: false }));
  gameState = { type: 'match', tiles: pair, first: null, moves: 0, matchedPairs: 0, finished: false };
}

function flipMatchTile(id) {
  if (!gameState || gameState.type !== 'match' || gameState.finished) return;
  const tile = gameState.tiles.find(t => t.id === id);
  if (!tile || tile.flipped || tile.matched) return;
  tile.flipped = true;
  if (gameState.first == null) {
    gameState.first = id;
    return;
  }
  gameState.moves++;
  const a = gameState.tiles.find(t => t.id === gameState.first);
  const b = tile;
  if (a.icon === b.icon) {
    a.matched = b.matched = true;
    gameState.matchedPairs++;
    gameState.first = null;
    if (gameState.matchedPairs >= 8) {
      gameState.finished = true;
      const user = currentUser();
      if (user) {
        const gs = ensureGameStats(user);
        gs.matches = (gs.matches || 0) + 1;
        const bonus = gameState.moves <= 16 ? 25 : gameState.moves <= 24 ? 15 : 8;
        gameState.earned = grantGamePoints(user, bonus, `cleared Memory Match in ${gameState.moves} moves`);
        if (gameState.moves <= 16 && !(user.badges || []).includes('Memory Master')) {
          user.badges = user.badges || [];
          user.badges.push('Memory Master');
        }
        save();
      }
    }
  } else {
    gameState.lock = true;
    const firstId = gameState.first;
    setTimeout(() => {
      if (!gameState || gameState.type !== 'match') return;
      const t1 = gameState.tiles.find(t => t.id === firstId);
      const t2 = gameState.tiles.find(t => t.id === id);
      if (t1 && !t1.matched) t1.flipped = false;
      if (t2 && !t2.matched) t2.flipped = false;
      gameState.first = null;
      gameState.lock = false;
      render();
    }, 550);
  }
}

function spinWheel() {
  const user = currentUser();
  if (!user) return { error: 'Log in to spin' };
  const gs = ensureGameStats(user);
  const today = new Date().toDateString();
  if (gs.lastSpinDate === today && (gs.spinsToday || 0) >= 3) {
    return { error: 'Daily spin limit reached (3). Come back tomorrow!' };
  }
  if (gs.lastSpinDate !== today) { gs.lastSpinDate = today; gs.spinsToday = 0; }
  gs.spinsToday = (gs.spinsToday || 0) + 1;
  gs.spins = (gs.spins || 0) + 1;
  const prizes = [
    { label: '5 pts', pts: 5, w: 30 },
    { label: '10 pts', pts: 10, w: 25 },
    { label: '15 pts', pts: 15, w: 18 },
    { label: '25 pts', pts: 25, w: 12 },
    { label: '50 pts!', pts: 50, w: 8 },
    { label: 'Try again', pts: 0, w: 7 }
  ];
  const total = prizes.reduce((s, p) => s + p.w, 0);
  let r = Math.random() * total;
  let won = prizes[0];
  for (const p of prizes) { r -= p.w; if (r <= 0) { won = p; break; } }
  let earned = 0;
  if (won.pts > 0) earned = grantGamePoints(user, won.pts, `won ${won.label} on the Daily Spin`);
  else save();
  gameState = { type: 'spin', result: won, earned, spinsLeft: 3 - gs.spinsToday };
  return gameState;
}

const BIZ_OPS_BANK = [
  { q: 'Best first response to a 2-star restroom review?', choices: ['Ignore it', 'Thank them, fix the issue, reply publicly', 'Delete the listing', 'Argue in comments'], a: 1 },
  { q: 'A “Top Business” showcase rewards…', choices: ['Only paid ads', 'High cleanliness + engagement', 'Random lottery', 'Closed locations'], a: 1 },
  { q: 'Multi-location owners should prioritize…', choices: ['One dirty flagship', 'Consistent cleanliness across sites', 'Hiding ratings', 'Fewer soap dispensers'], a: 1 },
  { q: 'QR check-ins help businesses by…', choices: ['Proving real visits for analytics', 'Replacing cleaning staff', 'Removing reviews', 'Blocking competitors'], a: 0 },
  { q: 'Enterprise Kleenest plans mainly add…', choices: ['Fewer members', 'Scale, point boosts, and team contests', 'No maps', 'Lower cleanliness goals'], a: 1 }
];

function startBizOpsGame() {
  const shuffled = [...BIZ_OPS_BANK].sort(() => Math.random() - 0.5).slice(0, 5);
  gameState = { type: 'biz-ops', questions: shuffled, index: 0, score: 0, finished: false };
}

function startDuel(opponentId) {
  const user = currentUser();
  const opp = state.users.find(u => u.id === opponentId);
  if (!user || !opp) return;
  if (!isPaidUser(user)) return;
  const shuffled = [...QUIZ_BANK].sort(() => Math.random() - 0.5).slice(0, 5);
  // Simulate opponent score (AI stand-in for async multiplayer demo)
  const oppScore = Math.min(5, Math.max(0, Math.round(3 + (Math.random() * 2) - (opp.points > user.points ? 0 : 0.5))));
  gameState = {
    type: 'duel',
    questions: shuffled,
    index: 0,
    score: 0,
    finished: false,
    opponentId: opp.id,
    opponentName: opp.businessName || opp.name,
    oppScore
  };
}

/* ========== MAP ========== */
function initMap() {
  const el = document.getElementById('map');
  if (!el || mapInstance) {
    if (mapInstance) {
      setTimeout(() => mapInstance.invalidateSize(), 50);
    }
    return;
  }
  const center = state.location ? [state.location.lat, state.location.lng] : [38.505, -89.699];
  mapInstance = L.map('map').setView(center, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(mapInstance);

  const bounds = [];
  state.restrooms.forEach(r => {
    if (typeof r.lat === 'number' && typeof r.lng === 'number') {
      const unrated = isUnrated(r);
      const color = unrated ? '#E8A23D' : (r.rating >= 4.5 ? '#27AE60' : r.rating >= 3.5 ? '#0E7C6B' : '#C1503F');
      const marker = L.circleMarker([r.lat, r.lng], {
        radius: unrated ? 9 : 8,
        color,
        fillColor: color,
        fillOpacity: unrated ? 0.45 : 0.85,
        weight: unrated ? 2 : 1,
        dashArray: unrated ? '4 3' : null
      }).addTo(mapInstance);
      const ratingLine = unrated
        ? '<span style="color:#8a5b12;font-weight:700">📝 Unrated — be the first!</span>'
        : `${r.rating} ⭐ · ${r.reviews} reviews`;
      marker.bindPopup(`<strong>${r.name}</strong><br>${ratingLine}<br>${r.distance || ''}<br><span style="font-size:11px;color:#5B6D66">${typeof sourceLabel==='function'?sourceLabel(r):''}</span><br><button class="btn btn-sm btn-primary" data-restroom="${r.id}" style="margin-top:6px">View</button>`);
      bounds.push([r.lat, r.lng]);
    }
  });
  if (bounds.length > 1 && !state.location) {
    try { mapInstance.fitBounds(bounds, { padding: [30, 30] }); } catch (e) {}
  }

  if (state.location) {
    userMarker = L.circleMarker([state.location.lat, state.location.lng], {
      radius: 8, color: '#0E7C6B', fillColor: '#0E7C6B', fillOpacity: 0.9
    }).addTo(mapInstance).bindPopup('You are here');
  }
}

function destroyMap() {
  if (mapInstance) {
    mapInstance.remove();
    mapInstance = null;
    userMarker = null;
  }
}

/* ========== RENDER ========== */
function render() {
  destroyMap();
  let content = tab === 'Home' ? home() :
    tab === 'Maps' ? maps() :
    tab === 'Route' ? routeView() :
    tab === 'Details' ? details() :
    tab === 'Social' ? socialView() :
    tab === 'Profile' ? profileView() :
    tab === 'Business' ? business() :
    tab === 'Admin' ? admin() : home();

  const footer = `<div class="footer-links"><a data-legal="privacy">Privacy Policy</a><a data-legal="terms">Terms of Service</a></div>`;
  root.innerHTML = `<div class="app-shell"><div class="app-card">${nav()}<main class="app-main">${content}</main>${footer}${bottom()}</div></div>`;

  setTimeout(wireQR, 30);

  if (tab === 'Maps') {

}

// Keep community / business-submitted listings (not from OSM live fetch)
function isUserSubmitted(r) {
  return r.source === 'community' || r.source === 'premium' || (r.id && String(r.id).startsWith('r') && r.owner === 'Community submitted');
}

function applyLocalRatings(restroom) {
  const list = (state.reviews && state.reviews[restroom.id]) || [];
  if (!list.length) {
    // Keep any existing seed ratings for non-OSM places; pure OSM starts unrated
    // Chain profiles keep cleanlinessPrior; municipal confirmed toilets stay unrated until reviewed
    if (restroom.source === 'osm' && !restroom.brandKey) {
      restroom.rating = 0;
      restroom.reviews = 0;
      restroom.cleanlinessPct = 0;
      restroom.verificationStatus = 'unrated';
    }
    return restroom;
  }
  const sum = list.reduce((s, rv) => s + (rv.stars || 0), 0);
  restroom.reviews = list.length;
  restroom.rating = +(sum / list.length).toFixed(1);
  restroom.cleanlinessPct = Math.round((restroom.rating / 5) * 100);
  restroom.cleanliness = restroom.rating >= 4.5 ? 'excellent' : restroom.rating >= 3.5 ? 'good' : restroom.rating >= 2.5 ? 'fair' : 'poor';
  restroom.verificationStatus = restroom.verified ? 'verified' : 'unrated';
  return restroom;
}

function classifyPublicPlace(tags) {
  // Brand profiles take priority when present
  const brandHit = lookupBrandProfile(tags.brand || tags.operator || tags.name);
  if (brandHit) return { type: brandHit.placeType, label: brandHit.label, confidence: brandHit.confidence, brandProfile: brandHit };

  if (tags.amenity === 'toilets' || tags.toilets === 'yes') return { type: 'restroom', label: 'Public restroom', confidence: 'confirmed' };
  if (tags.aeroway === 'aerodrome' || tags.aeroway === 'terminal' || tags.aeroway === 'gate') return { type: 'airport', label: 'Airport', confidence: 'likely' };
  if (tags.amenity === 'library') return { type: 'library', label: 'Library', confidence: 'likely' };
  if (tags.amenity === 'townhall' || tags.amenity === 'courthouse' || tags.office === 'government' || tags.government) return { type: 'government', label: 'Government', confidence: 'likely' };
  if (tags.amenity === 'community_centre' || tags.amenity === 'social_facility') return { type: 'community', label: 'Community center', confidence: 'likely' };
  if (tags.amenity === 'hospital' || tags.amenity === 'clinic' || tags.amenity === 'doctors') return { type: 'hospital', label: 'Medical', confidence: 'likely' };
  if (tags.leisure === 'park' || tags.leisure === 'nature_reserve' || tags.boundary === 'national_park') return { type: 'park', label: 'Park', confidence: 'likely' };
  if (tags.amenity === 'university' || tags.amenity === 'college' || tags.amenity === 'school') return { type: 'education', label: 'Campus', confidence: 'likely' };
  if (tags.railway === 'station' || tags.amenity === 'bus_station' || tags.public_transport === 'station') return { type: 'transit', label: 'Transit', confidence: 'likely' };
  if (tags.shop === 'mall' || tags.shop === 'department_store' || tags.amenity === 'marketplace') return { type: 'mall', label: 'Shopping', confidence: 'likely' };
  if (tags.amenity === 'fuel' || tags.highway === 'services' || tags.highway === 'rest_area') return { type: 'travel', label: 'Travel stop', confidence: 'likely' };
  if (tags.amenity === 'cafe' || tags.amenity === 'fast_food' || tags.amenity === 'restaurant') return { type: 'cafe', label: 'Food & drink', confidence: 'possible' };
  if (tags.shop === 'supermarket' || tags.shop === 'convenience' || tags.shop === 'yes') return { type: 'retail', label: 'Retail', confidence: 'possible' };
  if (tags.leisure === 'sports_centre' || tags.leisure === 'stadium' || tags.leisure === 'fitness_centre') return { type: 'fitness', label: 'Recreation', confidence: 'likely' };
  if (tags.tourism === 'museum' || tags.tourism === 'attraction' || tags.tourism === 'zoo' || tags.tourism === 'theme_park') return { type: 'tourism', label: 'Attraction', confidence: 'likely' };
  if (tags.amenity === 'theatre' || tags.amenity === 'cinema' || tags.amenity === 'arts_centre') return { type: 'culture', label: 'Arts & culture', confidence: 'likely' };
  if (tags.amenity === 'police' || tags.amenity === 'fire_station') return { type: 'public_safety', label: 'Public facility', confidence: 'possible' };
  if (tags.amenity === 'place_of_worship') return { type: 'worship', label: 'Place of worship', confidence: 'possible' };
  if (tags.amenity === 'post_office') return { type: 'post', label: 'Post office', confidence: 'possible' };
  return { type: 'public', label: 'Public place', confidence: 'possible' };
}

function osmElementToRestroom(el) {
  const tags = el.tags || {};
  const lat = el.lat || (el.center && el.center.lat);
  const lng = el.lon || (el.center && el.center.lon);
  if (lat == null || lng == null) return null;
  const id = 'osm-' + el.type + '-' + el.id;
  const cls = classifyPublicPlace(tags);
  const brand = cls.brandProfile || lookupBrandProfile(tags.brand || tags.operator || tags.name);
  const isExplicitToilet = tags.amenity === 'toilets' || tags.toilets === 'yes' || tags['toilets:access'] === 'yes' || tags['toilets:access'] === 'public';

  let name = tags.name || tags['name:en'] || tags['toilets:name'] || tags.description || null;
  if (!name && tags.brand) name = tags.brand;
  if (!name && tags.operator) name = tags.operator;
  if (!name && brand) name = brand.label;
  if (!name) name = cls.label;
  // Clarify restroom availability for non-toilet POIs (skip for known chains — name is clear)
  if (!isExplicitToilet && !brand && name && !/restroom|toilet|bathroom/i.test(name)) {
    name = name + ' (public restroom)';
  }

  let accessible = tags.wheelchair === 'yes' || tags['toilets:wheelchair'] === 'yes';
  let changing = tags.changing_table === 'yes' || tags['changing_table'] === 'yes' || tags.diaper === 'yes';
  if (brand) {
    if (brand.accessible) accessible = true;
    if (brand.changing) changing = true;
  }

  const amenities = [];
  if (isExplicitToilet) amenities.push('Mapped restroom');
  else if (brand) amenities.push('Chain location — typically has restrooms');
  else amenities.push('Typically has public restrooms');
  if (brand && brand.amenities) brand.amenities.forEach(a => { if (!amenities.includes(a)) amenities.push(a); });
  if (tags.fee === 'no') amenities.push('Free');
  if (tags.fee === 'yes') amenities.push('Paid');
  if (tags.drinking_water === 'yes') amenities.push('Water Fountain');
  if (accessible && !amenities.includes('Accessible Stall')) amenities.push('Accessible Stall');
  if (changing && !amenities.includes('Baby Changing')) amenities.push('Baby Changing');
  if (tags.unisex === 'yes' && !amenities.includes('Gender Neutral')) amenities.push('Gender Neutral');
  if (tags.internet_access === 'yes') amenities.push('Wi‑Fi');

  const addrParts = [tags['addr:housenumber'], tags['addr:street'], tags['addr:city']].filter(Boolean);
  const address = addrParts.length
    ? addrParts.join(' ')
    : (tags['addr:full'] || ((brand ? brand.label : cls.label) + ' · OpenStreetMap'));

  const conf = isExplicitToilet ? 'confirmed' : (brand ? brand.confidence : cls.confidence);
  const r = {
    id,
    name: name.length > 70 ? name.slice(0, 67) + '…' : name,
    address,
    lat: +lat,
    lng: +lng,
    rating: 0,
    distance: '—',
    isPremium: false,
    accessible: accessible || ['airport','hospital','library','government','transit','mall'].includes(cls.type),
    changing: changing || ['airport','mall','hospital','park'].includes(cls.type),
    verified: isExplicitToilet,
    cleanliness: brand && brand.cleanlinessPrior >= 85 ? 'excellent' : brand && brand.cleanlinessPrior >= 75 ? 'good' : 'good',
    cleanlinessPct: brand ? brand.cleanlinessPrior : 0,
    lastCleanedTime: 0,
    amenities,
    hours: { open: tags.opening_hours || 'See venue hours', close: '' },
    reviews: 0,
    businessPhone: tags.phone || tags['contact:phone'] || '',
    owner: tags.operator || tags.brand || (brand && brand.label) || tags.owner || 'Public',
    ownerEmail: null,
    verificationStatus: 'unrated',
    placeType: (brand && brand.placeType) || cls.type,
    restroomConfidence: conf,
    source: brand ? 'chain-osm' : 'osm',
    brandKey: brand ? brand.label : null,
    osmId: el.type + '/' + el.id
  };
  if (!state.reviews[id]) state.reviews[id] = [];
  return applyLocalRatings(r);
}

// Public places that usually offer restrooms + explicit toilets (OpenStreetMap)
async function overpassQuery(query) {
  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];
  let lastErr = null;
  for (const url of endpoints) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 28000);
      // Prefer GET — more compatible with some Overpass mirrors / CORS
      const getUrl = url + '?data=' + encodeURIComponent(query);
      let res = await fetch(getUrl, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        signal: controller.signal
      });
      if (!res.ok) {
        res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
            'Accept': 'application/json'
          },
          body: 'data=' + encodeURIComponent(query),
          signal: controller.signal
        });
      }
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Overpass failed');
}

// Smaller parallel queries — one huge query often times out
async function fetchNearbyPublicRestrooms(lat, lng, radiusM) {
  const r = radiusM || 15000;
  const rAir = Math.max(r, 45000);
  const rChain = Math.min(r, 12000);
  const around = (rad) => `(around:${rad},${lat},${lng})`;

  // Brand regex fragments for Overpass (case-insensitive via regex)
  const brandFilter = '["name"~"Starbucks|McDonald|Target|Walmart|Costco|Whole Foods|Trader Joe|Wawa|Sheetz|Casey|QuikTrip|Buc-ee|Chick-fil-A|Panera|Dunkin|Chipotle|Home Depot|Lowe|CVS|Walgreens|Kroger|Publix|Pilot|Flying J|Love.s",i]';
  const brandTag = '["brand"~"Starbucks|McDonald|Target|Walmart|Costco|Whole Foods|Wawa|Sheetz|QuikTrip|Chick-fil-A|Panera|Dunkin|Chipotle|Home Depot|Kroger|Publix|Pilot",i]';

  const batches = [
    // Explicit toilets
    `[out:json][timeout:25];(node["amenity"="toilets"]${around(r)};way["amenity"="toilets"]${around(r)};node["toilets"="yes"]${around(r)};node["toilets:access"="yes"]${around(r)};node["toilets:access"="public"]${around(r)};);out center body 50;`,
    // Civic / libraries / government
    `[out:json][timeout:25];(node["amenity"="library"]${around(r)};way["amenity"="library"]${around(r)};node["amenity"="townhall"]${around(r)};way["amenity"="townhall"]${around(r)};node["amenity"="courthouse"]${around(r)};node["office"="government"]${around(r)};node["amenity"="community_centre"]${around(r)};node["amenity"="post_office"]${around(r)};node["amenity"="police"]${around(r)};node["amenity"="fire_station"]${around(r)};);out center body 55;`,
    // Medical / education / transit
    `[out:json][timeout:25];(node["amenity"="hospital"]${around(r)};way["amenity"="hospital"]${around(r)};node["amenity"="clinic"]${around(r)};node["amenity"="university"]${around(r)};node["amenity"="college"]${around(r)};node["amenity"="school"]["name"]${around(Math.min(r,8000))};node["railway"="station"]${around(r)};node["amenity"="bus_station"]${around(r)};node["public_transport"="station"]${around(r)};);out center body 55;`,
    // Parks / culture / recreation
    `[out:json][timeout:25];(node["leisure"="park"]["name"]${around(r)};way["leisure"="park"]["name"]${around(Math.min(r,12000))};node["leisure"="sports_centre"]${around(r)};node["leisure"="stadium"]${around(r)};node["leisure"="fitness_centre"]${around(r)};node["tourism"="museum"]${around(r)};node["tourism"="attraction"]["name"]${around(r)};node["amenity"="theatre"]${around(r)};node["amenity"="cinema"]${around(r)};);out center body 55;`,
    // Airports / malls / fuel / rest areas
    `[out:json][timeout:25];(node["aeroway"="aerodrome"]${around(rAir)};way["aeroway"="aerodrome"]${around(rAir)};node["aeroway"="terminal"]${around(rAir)};node["shop"="mall"]${around(r)};way["shop"="mall"]${around(r)};node["shop"="department_store"]${around(r)};node["amenity"="fuel"]["name"]${around(Math.min(r,10000))};node["highway"="services"]${around(r)};node["highway"="rest_area"]${around(r)};);out center body 45;`,
    // Major chain brands (name or brand tag) — high-probability restroom locations
    `[out:json][timeout:25];(node${brandFilter}${around(rChain)};way${brandFilter}${around(rChain)};node${brandTag}${around(rChain)};way${brandTag}${around(rChain)};node["amenity"="cafe"]["brand"]${around(rChain)};node["amenity"="fast_food"]["brand"]${around(rChain)};node["shop"="supermarket"]["brand"]${around(rChain)};node["shop"="convenience"]["brand"]${around(rChain)};);out center body 80;`
  ];

  const results = await Promise.allSettled(batches.map(q => overpassQuery(q)));
  const elements = [];
  let ok = 0;
  results.forEach(res => {
    if (res.status === 'fulfilled' && res.value && res.value.elements) {
      ok++;
      elements.push(...res.value.elements);
    }
  });
  if (!elements.length) throw new Error('No Overpass results (' + ok + ' batches ok)');

  const mapped = elements.map(osmElementToRestroom).filter(Boolean);
  const seen = new Set();
  const unique = [];
  mapped.forEach(place => {
    const key = place.lat.toFixed(4) + ',' + place.lng.toFixed(4) + '|' + (place.name || '').slice(0, 24).toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    unique.push(place);
  });
  unique.sort((a, b) => {
    const rank = (x) => x.restroomConfidence === 'confirmed' ? 0 : x.restroomConfidence === 'likely' ? 1 : 2;
    const brandBoost = (x) => x.source === 'chain-osm' ? -0.5 : 0;
    return (rank(a) + brandBoost(a)) - (rank(b) + brandBoost(b));
  });
  return unique.slice(0, 160);
}

function refreshMapsUi(latitude, longitude, accuracy, meta) {
  meta = meta || {};
  if (tab !== 'Maps') return;
  const status = document.getElementById('gps-status');
  if (status) {
    status.className = 'gps-status ok';
    let msg = 'Near you · ' + Math.round(accuracy || 0) + 'm accuracy';
    if (meta.count != null) msg += ' · ' + meta.count + ' public places';
    if (meta.note) msg += ' · ' + meta.note;
    status.innerHTML = '<span class="location-dot ok"></span>' + msg;
  }
  const locationBtn = document.getElementById('use-location');
  if (locationBtn) { locationBtn.disabled = false; locationBtn.style.opacity = '1'; }

  if (mapInstance && latitude != null) {
    mapInstance.setView([latitude, longitude], 14);
    if (userMarker) mapInstance.removeLayer(userMarker);
    userMarker = L.circleMarker([latitude, longitude], {
      radius: 8, color: '#0E7C6B', fillColor: '#0E7C6B', fillOpacity: 0.9
    }).addTo(mapInstance).bindPopup('You are here');
    mapInstance.eachLayer(layer => {
      if (layer instanceof L.CircleMarker && layer !== userMarker) {
        try { mapInstance.removeLayer(layer); } catch (e) {}
      }
    });
    state.restrooms.forEach(r => {
      if (typeof r.lat !== 'number') return;
      const unrated = isUnrated(r);
      const color = unrated ? '#E8A23D' : (r.rating >= 4.5 ? '#27AE60' : r.rating >= 3.5 ? '#0E7C6B' : '#C1503F');
      L.circleMarker([r.lat, r.lng], {
        radius: unrated ? 9 : 8, color, fillColor: color,
        fillOpacity: unrated ? 0.45 : 0.85, weight: unrated ? 2 : 1,
        dashArray: unrated ? '4 3' : null
      }).addTo(mapInstance).bindPopup(
        `<strong>${r.name}</strong><br>${unrated ? '📝 Unrated — public place' : r.rating + ' ⭐'} · ${r.distance}<br>` +
        `<span style="font-size:11px;color:#5B6D66">${sourceLabel(r)}</span><br>` +
        `<button class="btn btn-sm btn-primary" data-restroom="${r.id}" style="margin-top:6px">View</button>`
      );
    });
  }
  const results = document.getElementById('results');
  if (results) {
    const unratedCount = state.restrooms.filter(isUnrated).length;
    const ratedCount = state.restrooms.length - unratedCount;
    results.innerHTML =
      `<p class="profile-sub" style="margin-bottom:8px">${state.restrooms.length} places nearby · ${ratedCount} rated · ${unratedCount} unrated</p>` +
      state.restrooms.map(item).join('');
  }
}
