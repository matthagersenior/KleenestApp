name: Kleenest Quality
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js tests/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: Validate JSON
        shell: bash
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Verify required app-shell files
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js index.html manifest.webmanifest sw.js capacitor.config.ts kleenest-supabase.js kleenest-supabase-runtime.js kleenest-account-lifecycle.js kleenest-account-ui.js privacy.html terms.html support.html icon-placeholder.svg; do test -f "$f"; done
      - name: Verify manifest icon reference
        run: test -f icon-placeholder.svg && grep -q 'icon-placeholder.svg' manifest.webmanifest
      - name: Run runtime smoke checks
        run: node tests/kleenest-runtime-smoke.js
      - name: Run auth contract checks
        run: node tests/auth-contract.js
      - name: Run auth UI contract checks
        run: node tests/auth-ui-contract.js
      - name: Run account lifecycle/UI checks
        run: node tests/account-contract.js
      - name: Run app-shell/PWA safety checks
        run: node tests/app-shell-contract.js
      - name: Run modular parity checks
        run: node tests/modular-parity-contract.js
      - name: Run acceptance harness checks
        run: node tests/acceptance-contract.js
      - name: Run runtime health checks
        run: node tests/runtime-health-contract.js
      - name: Run Supabase boundary checks
        run: node tests/supabase-boundary-contract.js
      - name: Run legacy production boundary checks
        run: node tests/legacy-production-boundary.js
      - name: Run production index boundary checks
        run: node tests/production-index-boundary.js
      - name: Run current-index migration contract
        run: node tests/production-index-contract.js
      - name: Run release gate contract
        run: node tests/release-gate-contract.js
      - name: Run critical-file contract
        run: node tests/critical-file-contract.js
      - name: Run demo-secret boundary contract
        run: node tests/demo-secrets-contract.js
      - name: Run fail-closed contract
        run: node tests/fail-closed-contract.js
      - name: Run social/gamification/surface contract
        run: node tests/social-gamification-contract.js
      - name: Run gamification schema contract
        run: node tests/gamification-schema-contract.js
      - name: Run feature completion contract
        run: node tests/feature-completion-contract.js
      - name: Run feature UI integration contract
        run: node tests/feature-ui-contract.js
      - name: Run route feature contract
        run: node tests/route-feature-contract.js
      - name: Run modular surface-controller contract
        run: node tests/surface-controller-contract.js
      - name: Run modular surface-domain contract
        run: node tests/surface-domain-contract.js
      - name: Run cross-surface engagement contract
        run: node tests/cross-surface-engagement-contract.js
