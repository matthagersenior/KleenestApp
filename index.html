<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kleenest — Find the Kleenest places nearby</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#16211d;--muted:#5b6d66;--bg:#f6f9f7;--surface:#fff;--teal:#0e7c6b;--teal-deep:#0a5c4f;--teal-tint:#e4f2ee;--blue:#3e7c99;--blue-tint:#e8f1f5;--gold:#e8a23d;--line:#d8dfdc;--danger:#c1503f;--green:#27ae60;--shadow:0 10px 30px rgba(22,33,29,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh;display:flex;justify-content:center;padding-bottom:84px}.app-card{width:100%;max-width:1040px;min-height:100vh;background:var(--surface);box-shadow:var(--shadow)}.app-main{padding:22px 18px 40px}.top-nav{display:none;padding:18px 28px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--teal-deep);font-size:1.35rem}.brand-mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff}.nav-links{display:flex;gap:6px;flex-wrap:wrap}.nav-btn,.bottom-btn{border:0;background:transparent;color:var(--muted);font-weight:700;border-radius:999px;padding:9px 13px}.nav-btn.active,.bottom-btn.active{background:var(--teal);color:#fff}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:7px 4px env(safe-area-inset-bottom)}.bottom-btn{font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px}.card{border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;background:#fff}.accent{background:linear-gradient(135deg,var(--teal-tint),#fff);border-color:#b9ded5}.blue{background:var(--blue-tint)}.stack{display:flex;flex-direction:column;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.success,.ghost,.danger{border:0;border-radius:11px;padding:12px 17px;font-weight:750}.primary{background:var(--teal);color:#fff}.secondary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.ghost{background:#e9eeec;color:var(--ink)}.danger{background:var(--danger);color:#fff}.muted{color:var(--muted)}.badge,.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;background:#fff;color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.chip{white-space:nowrap;cursor:pointer}.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}.map-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.map-layout #map{height:360px;border:1px solid var(--line);border-radius:16px;overflow:hidden}.results{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}.place{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left}.place strong,.place span,.place em{display:block}.place span,.place em{font-size:.78rem;color:var(--muted);margin-top:3px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:6px}.auth-button{border:0;border-radius:999px;background:var(--teal);color:#fff;padding:9px 13px;font-weight:750}.empty{padding:20px;text-align:center;color:var(--muted)}h1{margin:0 0 8px}h2,h3,p{margin-top:0}@media(min-width:769px){.app-shell{padding:30px 24px}.app-card{border-radius:22px;min-height:calc(100vh - 60px)}.top-nav{display:flex}.bottom-nav{display:none}.app-main{padding:30px 32px 44px}.map-layout{grid-template-columns:1.55fr 1fr}}@media(max-width:700px){.map-layout{grid-template-columns:1fr}.map-layout #map{height:300px}}
</style>
</head>
<body>
<div class="app-shell"><div class="app-card">
<header class="top-nav" id="modular-top-nav"></header>
<main class="app-main" id="modular-root"><div id="modular-workspace" class="stack"><div class="card accent"><span class="badge">KLEENEST</span><h1>Find the Kleenest places nearby.</h1><p class="muted">Nearby discovery, check-ins, reviews, routes, rewards and community data in one place.</p><div class="actions"><button class="primary" data-kleenest-start="maps">Open Maps</button><button class="secondary" data-kleenest-start="route">Plan a Route</button></div></div></div></main>
</div></div>
<script src="kleenest-modular-entry.js"></script>
<script>
(function(){
 const start=()=>document.querySelectorAll('[data-kleenest-start]').forEach(b=>b.addEventListener('click',()=>window.KleenestAppShell?.navigate?.(b.dataset.kleenestStart==='maps'?'Maps':'Route')));
 document.addEventListener('DOMContentLoaded',start);window.addEventListener('kleenest:auth-state-changed',start);window.addEventListener('kleenest:auth-ui-refresh',start);
})();
</script>
</body></html>
