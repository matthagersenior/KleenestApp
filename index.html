function isPremiumUser(u){ return !!u && ['Premium','Fleet','Enterprise'].includes(u.subscriptionLevel); }
function isBusiness(u){ return !!u?.isBusinessUser; }
function normalizePlaceKey(name,address){ return `${String(name||'').trim().toLowerCase()}|${String(address||'').trim().toLowerCase()}`; }
function resolveBusinessRestroom(user){
  if(!user || !user.businessRestroomId) return state.restrooms.find(r=>r.ownerId===user?.id) || null;
  return state.restrooms.find(r=>r.id===user.businessRestroomId) || null;
}
function unreadNotifications(u){return (state.notifications||[]).filter(n=>n.userId===u?.id&&!n.read);}

function initMap(){const el=document.getElementById('map');if(!el||typeof L==='undefined')return;mapInstance=L.map(el).setView([38.505,-89.699],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapInstance);state.restrooms.forEach(r=>L.marker([r.lat,r.lng]).addTo(mapInstance).bindPopup(`<strong>${esc(r.name)}</strong><br>${esc(r.address)}`));}

/* ========== EVENTS ========== */
document.addEventListener('click', e => {
  const t=e.target.closest('[data-tab]');
  if(t){tab=t.dataset.tab;render();return;}
  const rr=e.target.closest('[data-restroom]');
  if(rr){selected=state.restrooms.find(r=>r.id===rr.dataset.restroom)||selected;tab='Details';render();return;}
  if(e.target.closest('[data-open-auth]')){document.querySelector('.modal-overlay')?.remove();document.body.insertAdjacentHTML('beforeend',authModal());return;}
  if(e.target.closest('[data-logout]')){state.session=null;save();render();return;}
  const authTab=e.target.closest('[data-auth-tab]');
  if(authTab){document.querySelectorAll('[data-auth-tab]').forEach(b=>b.classList.remove('active'));authTab.classList.add('active');const body=document.getElementById('auth-body');if(body)body.innerHTML=authPanel(authTab.dataset.authTab);return;}
  if(e.target.closest('[data-do-login]')){const email=document.getElementById('login-email')?.value?.trim().toLowerCase();const pass=document.getElementById('login-pass')?.value;const u=state.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);if(!u){alert('Invalid email or password');return;}state.session=u.id;save();document.querySelector('.modal-overlay')?.remove();render();return;}
  if(e.target.closest('[data-do-signup]')){const name=document.getElementById('su-name')?.value?.trim();const email=document.getElementById('su-email')?.value?.trim().toLowerCase();const pass=document.getElementById('su-pass')?.value;if(!name||!email||!pass||pass.length<6){alert('Please fill all fields (password ≥ 6 chars)');return;}if(state.users.some(x=>x.email.toLowerCase()===email)){alert('Email already registered');return;}const id='u'+Date.now();state.users.push({id,name,email,password:pass,isBusinessUser:false,isAdmin:false,points:0,badges:['First Check-in'],subscriptionLevel:'Free',avatar:'👤',joinDate:new Date().toLocaleString('en',{month:'short',year:'numeric'}),totalCheckIns:0,totalReviews:0,businessName:null,verificationStatus:null,following:[],followers:[],likedReviews:[],streak:0,level:1,lastCheckInDay:null,favorites:[],familyMembers:[]});state.session=id;save();document.querySelector('.modal-overlay')?.remove();render();return;}
  if(e.target.closest('[data-do-biz-signup]')){const name=document.getElementById('biz-su-name')?.value?.trim();const biz=document.getElementById('biz-su-biz')?.value?.trim();const address=document.getElementById('biz-su-address')?.value?.trim();const email=document.getElementById('biz-su-email')?.value?.trim().toLowerCase();const pass=document.getElementById('biz-su-pass')?.value;if(!name||!biz||!address||!email||!pass||pass.length<6){alert('Please fill all fields (password ≥ 6 chars)');return;}if(state.users.some(x=>x.email.toLowerCase()===email)){alert('Email already registered');return;}const id='u'+Date.now();state.users.push({id,name,email,password:pass,isBusinessUser:true,isAdmin:false,points:0,badges:['Business Owner'],subscriptionLevel:'Business',avatar:'🏢',joinDate:new Date().toLocaleString('en',{month:'short',year:'numeric'}),totalCheckIns:0,totalReviews:0,businessName:biz,businessAddress:address,businessPhone:document.getElementById('biz-su-phone')?.value?.trim()||'',businessWebsite:document.getElementById('biz-su-website')?.value?.trim()||'',businessPlaceType:document.getElementById('biz-su-type')?.value||'other',verificationStatus:'pending',businessTier:'standard',following:[],followers:[],likedReviews:[],streak:0,level:1,lastCheckInDay:null,favorites:[],familyMembers:[]});state.session=id;save();document.querySelector('.modal-overlay')?.remove();render();return;}
  if(e.target.closest('[data-checkin]')){const u=currentUser();if(!u){document.querySelector('.modal-overlay')?.remove();document.body.insertAdjacentHTML('beforeend',authModal());return;}const rid=e.target.closest('[data-checkin]').dataset.checkin;const r=state.restrooms.find(x=>x.id===rid);if(r){u.totalCheckIns=(u.totalCheckIns||0)+1;grantPoints(u,10);pushActivity({type:'checkin',userId:u.id,user:u.name,text:`checked in at ${r.name}`,restroomId:rid});save();alert(`Checked in at ${r.name}! +10 points.`);render();}return;}
  // Close modal: explicit close controls, or the dimmed backdrop itself.
  // IMPORTANT: the overlay carries data-close-modal too, so a naive closest()
  // would treat every input/button inside the modal as a close request on touch.
  const closeTarget=e.target.closest('[data-close-modal]');
  const isBackdropClose=closeTarget?.classList?.contains('modal-overlay')&&e.target===closeTarget;
  const isExplicitClose=closeTarget&&!closeTarget.classList.contains('modal-overlay');
  if(isBackdropClose||isExplicitClose){e.preventDefault();document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());return;}
  if(e.target.classList.contains('modal-overlay')){document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());return;}
  if(e.target.closest('[data-reset-demo]')){if(!confirm('Clear all local demo data and restore defaults?'))return;localStorage.removeItem(DB.key);state=DB.load();selected=state.restrooms[0];tab='Home';render();return;}
  if(e.target.closest('[data-privacy]')){alert('Privacy policy placeholder for demo.');return;}
  if(e.target.closest('[data-terms]')){alert('Terms placeholder for demo.');return;}
  if(e.target.closest('[data-business-onboarding]')){document.body.insertAdjacentHTML('beforeend',businessOnboardingModal());return;}
});

function businessOnboardingModal(){const u=currentUser();if(!u||!u.isBusinessUser)return '';return `<div class="modal-overlay" data-close-modal><div class="modal-box"><h2 class="page-title">Set up your Kleenest location</h2><label>Business name<input id="bo-name" class="form-input" value="${esc(u.businessName||'')}"></label><label>Address<input id="bo-address" class="form-input" value="${esc(u.businessAddress||'')}"></label><label>Phone<input id="bo-phone" class="form-input" value="${esc(u.businessPhone||'')}"></label><label>Website<input id="bo-website" class="form-input" value="${esc(u.businessWebsite||'')}"></label><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn btn-ghost" data-close-modal>Cancel</button></div></div></div>`;}

function boot(){try{render();requestLocation();}catch(e){console.error(e);const x=document.getElementById('startup-error');if(x)x.style.display='block';}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
</script>
</body>
</html>
