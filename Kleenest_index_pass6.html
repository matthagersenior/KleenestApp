/** Fetch municipal open-data restrooms when the user is inside a supported metro */
async function fetchMunicipalRestrooms(lat, lng) {
  const sources = municipalSourcesNear(lat, lng);
  if (!sources.length) return [];
  const out = [];
  await Promise.all(sources.map(async (src) => {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      const res = await fetch(src.url, {
        headers: { 'Accept': 'application/json' },
        signal: controller.signal
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!Array.isArray(rows)) return;
      rows.forEach(row => {
        try {
          const mapped = src.mapRow(row);
          if (!mapped) return;
          // Keep only those within ~15 mi of the user
          if (distanceMiles(lat, lng, mapped.lat, mapped.lng) > 15) return;
          if (!state.reviews[mapped.id]) state.reviews[mapped.id] = [];
          out.push(applyLocalRatings(mapped));
        } catch (e) {}
      });
    } catch (e) {
      console.warn('Municipal feed failed:', src.id, e);
    }
  }));
  return out;
}

/**
 * Seed representative chain locations near the user when OSM is sparse.
 * Offsets are deterministic per brand so the same area gets stable demo pins.
 */
function seedChainPlacesNearLocation(lat, lng, existing) {
  const have = existing || [];
  const seenNames = new Set(have.map(r => (r.name || '').toLowerCase()));
  const brandList = [
    { key: 'starbucks', off: [0.0045, -0.0032] },
    { key: 'mcdonald\'s', off: [-0.0055, 0.0041] },
    { key: 'target', off: [0.0092, 0.0068] },
    { key: 'walmart', off: [-0.011, -0.0085] },
    { key: 'costco', off: [0.014, -0.010] },
    { key: 'wawa', off: [-0.0038, 0.0072] },
    { key: 'chick-fil-a', off: [0.0061, 0.0029] },
    { key: 'panera bread', off: [-0.0074, -0.0046] },
    { key: 'home depot', off: [0.012, 0.009] },
    { key: 'cvs', off: [-0.0025, -0.0058] }
  ];
  const out = [];
  // Only seed if we have fewer than 25 places total (avoid clutter when OSM is rich)
  if (have.length >= 25) return out;
  brandList.forEach((b, i) => {
    if (have.length + out.length >= 35) return;
    const profile = BRAND_PROFILES[b.key];
    if (!profile) return;
    const name = profile.label;
    // Skip if a real OSM/chain listing with same brand is already nearby
    const already = have.some(r => {
      const n = (r.name || '').toLowerCase();
      return n.includes(profile.label.toLowerCase().split(' ')[0]) &&
        typeof r.lat === 'number' &&
        distanceMiles(lat, lng, r.lat, r.lng) < 2;
    });
    if (already || seenNames.has(name.toLowerCase())) return;
    const id = 'chain-seed-' + b.key.replace(/\W+/g, '') + '-' + Math.round(lat * 200) + '-' + Math.round(lng * 200);
    const r = {
      id,
      name: name + ' (nearby)',
      address: profile.label + ' · chain location near you',
      lat: lat + b.off[0],
      lng: lng + b.off[1],
      rating: 0, distance: '—', isPremium: false,
      accessible: !!profile.accessible, changing: !!profile.changing, verified: false,
      cleanliness: profile.cleanlinessPrior >= 85 ? 'excellent' : 'good',
      cleanlinessPct: profile.cleanlinessPrior || 0, lastCleanedTime: 0,
      amenities: (profile.amenities || []).slice(),
      hours: { open: 'Store hours', close: '' }, reviews: 0,
      businessPhone: '', owner: profile.label, ownerEmail: null, verificationStatus: 'unrated',
      placeType: profile.placeType,
      restroomConfidence: profile.confidence,
      source: 'chain-seed',
      brandKey: profile.label
    };
    if (!state.reviews[id]) state.reviews[id] = [];
    out.push(applyLocalRatings(r));
    seenNames.add(name.toLowerCase());
  });
  return out;
}

async function loadRestroomsForLocation(latitude, longitude, accuracy) {
  state.location = { lat: latitude, lng: longitude, accuracy, savedAt: Date.now() };
  // Persist location only (session layers excluded by save())
  save();

  const status = document.getElementById('gps-status');
  if (status) {
    status.className = 'gps-status';
    status.innerHTML = '<span class="location-dot"></span>Loading public restrooms, chains &amp; open data…';
  }

  // Keep only persistent listings in memory base, then layer live data on top
  const persistent = (state.restrooms || []).filter(r => !isSessionLayer(r));
  const submitted = persistent.filter(isUserSubmitted);
  // Seed catalog nearby (demo catalog — treated as persistent base data)
  const seedNearby = (state._seedRestrooms || DB.defaults().restrooms).filter(r => {
    if (typeof r.lat !== 'number') return false;
    return distanceMiles(latitude, longitude, r.lat, r.lng) < 15;
  }).map(r => {
    const copy = Object.assign({}, r);
    if (!state.reviews[copy.id]) state.reviews[copy.id] = state.reviews[copy.id] || [];
    return applyLocalRatings(copy);
  });

  let osmList = [];
  let municipalList = [];
  let noteParts = [];

  const [osmResult, muniResult] = await Promise.allSettled([
    (async () => {
      let list = await fetchNearbyPublicRestrooms(latitude, longitude, 15000);
      if (list.length < 10) {
        const wider = await fetchNearbyPublicRestrooms(latitude, longitude, 25000);
        const ids = new Set(list.map(r => r.id));
        wider.forEach(r => { if (!ids.has(r.id)) list.push(r); });
        if (wider.length) noteParts.push('expanded OSM radius');
      }
      return list;
    })(),
    fetchMunicipalRestrooms(latitude, longitude)
  ]);

  if (osmResult.status === 'fulfilled') {
    osmList = osmResult.value || [];
  } else {
    console.warn('OSM fetch failed', osmResult.reason);
    noteParts.push('map data offline');
  }
  if (muniResult.status === 'fulfilled') {
    municipalList = muniResult.value || [];
    if (municipalList.length) noteParts.push(municipalList.length + ' municipal');
  }

  // Merge: municipal + OSM + seeds + community (session layers live only in memory)
  const byId = new Map();
  [...municipalList, ...osmList, ...seedNearby, ...submitted, ...persistent].forEach(r => {
    if (!byId.has(r.id)) byId.set(r.id, r);
  });
  state.restrooms = Array.from(byId.values());
  state.restrooms.forEach(r => {
    if (!state.reviews[r.id]) state.reviews[r.id] = [];
    applyLocalRatings(r);
  });
  normalizeGeoFeatures(state.restrooms);

  const chainSeeds = seedChainPlacesNearLocation(latitude, longitude, state.restrooms);
  if (chainSeeds.length) {
    chainSeeds.forEach(r => { if (!byId.has(r.id)) { byId.set(r.id, r); state.restrooms.push(r); } });
    noteParts.push(chainSeeds.length + ' chain seeds');
  }

  const before = state.restrooms.length;
  state.restrooms = ensureMinimumPublicPlaces(latitude, longitude, state.restrooms);
  if (state.restrooms.length > before) noteParts.push('public venue fill');

  updateDistances(latitude, longitude);
  state._liveOsm = osmList.length > 0;
  state._liveMunicipal = municipalList.length > 0;
  state._liveLayers = {
    osm: osmList.length,
    municipal: municipalList.length,
    chain: chainSeeds.length,
    at: Date.now()
  };
  // Intentionally do NOT save session layers — save() strips them if called

  const chainCount = state.restrooms.filter(r => r.source === 'chain-osm' || r.source === 'chain-seed' || r.brandKey).length;
  const muniCount = state.restrooms.filter(r => r.source === 'municipal').length;
  let note = noteParts.join(' · ');
  if (!note) {
    const bits = [];
    if (osmList.length) bits.push('OpenStreetMap');
    if (muniCount) bits.push('municipal open data');
    if (chainCount) bits.push('chain locations');
    bits.push('Kleenest');
    note = 'from ' + bits.join(' + ');
  }

  refreshMapsUi(latitude, longitude, accuracy, {
    count: state.restrooms.length,
    note
  });
}

function onLocationSuccess(latitude, longitude, accuracy) {
  // Fire-and-forget async load of public places in radius
  loadRestroomsForLocation(latitude, longitude, accuracy);
}

function requestLocation(opts) {
  opts = opts || {};
  const status = document.getElementById('gps-status');
  const locationBtn = document.getElementById('use-location');
  const setStatus = (text, stateCls) => {
    if (!status) return;
    status.className = 'gps-status ' + (stateCls || '');
    status.innerHTML = '<span class="location-dot ' + (stateCls === 'ok' ? 'ok' : '') + '"></span>' + text;
  };
  setStatus(opts.silent ? 'Detecting your location…' : 'Finding your location…', '');
  if (locationBtn) { locationBtn.disabled = true; locationBtn.style.opacity = '.65'; }
  window.KleenestLocation.request()
    .then(({latitude, longitude, accuracy}) => {
      onLocationSuccess(latitude, longitude, accuracy);
      if (locationBtn) { locationBtn.disabled = false; locationBtn.style.opacity = '1'; }
      if (!opts.silent && tab !== 'Maps') { tab = 'Maps'; render(); }
    })
    .catch(error => {
      const messages = {1:'Location denied — pick a city below or enable GPS',2:'Location unavailable — pick a city below',3:'Location timed out — pick a city below'};
      setStatus(messages[error.code] || error.message || 'Unable to get your location — pick a city below', 'err');
      if (locationBtn) { locationBtn.disabled = false; locationBtn.style.opacity = '1'; }
      if (!state._fallbackLoaded) {
        state._fallbackLoaded = true;
        loadRestroomsForLocation(38.6270, -90.1994, 100);
      }
    });
}

function wireGps() {
  const locationBtn = document.getElementById('use-location');
  if (locationBtn) locationBtn.onclick = function() { requestLocation({ silent: false }); };

  if (state.location) {
    const status = document.getElementById('gps-status');
    if (status && status.textContent.indexOf('Loading') === -1) {
      status.className = 'gps-status ok';
      status.innerHTML = '<span class="location-dot ok"></span>Showing public places near you' +
        (state._liveOsm ? ' · OpenStreetMap' : '');
    }
  }
}

// Auto-locate as soon as the page opens so shared links show nearby results
function autoLocateOnLoad() {
  if (!navigator.geolocation) return;
  // Use cached location from the last day without re-prompting if possible
  if (state.location && Date.now() - (state.location.savedAt || 0) < 86400000) {
    onLocationSuccess(state.location.lat, state.location.lng, state.location.accuracy || 50);
    return;
  }
  requestLocation({ silent: true });
}

/* ========== EVENTS ========== */
document.addEventListener('click', e => {
  // Tabs
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; render(); return; }

  // Favorite toggle (checked before restroom select so it doesn't also navigate away)
  const favBtn = e.target.closest('[data-favorite]');
  if (favBtn) {
    const user = currentUser();
    if (!user) { alert('Please log in to favorite restrooms.'); return; }
    const rid = favBtn.dataset.favorite;
    if (!user.favorites) user.favorites = [];
    const idx = user.favorites.indexOf(rid);
    if (idx === -1) user.favorites.push(rid); else user.favorites.splice(idx, 1);
    recordContestAction(user, 'favorite');
    trackBusinessEvent(rid, 'favorite', {action: idx === -1 ? 'add' : 'remove'});
    save();
    render();
    return;
  }

  // Restroom select
  const r = e.target.closest('[data-restroom]');
  if (r) {
    selected = state.restrooms.find(x => x.id === r.dataset.restroom);
    tab = 'Details';
    render();
    return;
  }

  // Filters
  const f = e.target.closest('[data-filter]');
  if (f) {
    if (f.disabled) return;
    const user = currentUser();
    const key = f.dataset.filter;
    // Gate premium filters
    if (!BASIC_FILTERS.includes(key) && !isPremiumUser(user)) {
      alert('Premium subscription required for amenity filters. Upgrade from Profile → Subscription.');
      return;
    }
    f.classList.toggle('active');
    applyFilters();
    return;
  }

  // Check-in
  if (e.target.closest('[data-checkin]')) {
    const user = currentUser();
    if (!user) { alert('Please log in to check in.'); return; }
    updateStreak(user);
    const ac = recordContestAction(user, 'checkin');
    if (!ac.ok) { alert(ac.reason); save(); return; }
    user.totalCheckIns = (user.totalCheckIns || 0) + 1;
    const earned = grantPoints(user, 10, 'checkin');
    if (user.contestTallies) user.contestTallies.pointsEarned = (user.contestTallies.pointsEarned || 0) + earned;
    const r = selected || state.restrooms[0];
    pushActivity({type:'checkin', userId:user.id, user:user.name, text:`checked in at ${r.name} (+${earned} pts)`, restroomId:r.id});
    save();
    alert(`Checked in! +${earned} points (streak: ${user.streak} day${user.streak===1?'':'s'})`);
    render();
    return;
  }

  // Geofence check ("Am I here?")
  const geoCheck = e.target.closest('[data-check-geofence]');
  if (geoCheck) {
    const r = state.restrooms.find(x => x.id === geoCheck.dataset.checkGeofence);
    const box = document.getElementById('geofence-result');
    if (r && box) {
      box.textContent = 'Checking your location…';
      checkGeofence(r).then(res => {
        if (!res.ok) { box.textContent = '⚠️ ' + res.reason; return; }
        box.textContent = res.inside
          ? `✓ You're inside the geofence (~${Math.round(res.distMiles*5280)} ft from entrance).`
          : `You're outside the geofence (~${res.distMiles.toFixed(2)} mi away). Get closer to check in/out.`;
      });
    }
    return;
  }

  // Start visit (check in for occupancy)
  const startV = e.target.closest('[data-start-visit]');
  if (startV) {
    const user = currentUser();
    if (!user) { alert('Please log in to check in/out.'); return; }
    const r = state.restrooms.find(x => x.id === startV.dataset.startVisit);
    if (!r) return;
    startVisitSession(r, user);
    render();
    return;
  }

  // End visit (check out)
  const endV = e.target.closest('[data-end-visit]');
  if (endV) {
    const user = currentUser();
    const r = state.restrooms.find(x => x.id === endV.dataset.endVisit);
    if (!user || !r) return;
    endVisitSession(r, user);
    render();
    return;
  }

  // Premium: buy a single-use pass
  const buyUse = e.target.closest('[data-buy-use]');
  if (buyUse) {
    const user = currentUser();
    if (!isPremiumUser(user)) { alert('Buying single-use passes is a Premium feature.'); return; }
    const r = state.restrooms.find(x => x.id === buyUse.dataset.buyUse);
    if (!r) return;
    const pass = buyPremiumUse(r, user);
    alert(`✓ Pass generated: ${pass.code}\nShow this QR at the entrance to redeem it once.`);
    render();
    return;
  }

  // Redeem a rental / single-use pass code
  const redeemPassBtn = e.target.closest('[data-redeem-pass]');
  if (redeemPassBtn) {
    const user = currentUser();
    const r = state.restrooms.find(x => x.id === redeemPassBtn.dataset.redeemPass);
    const input = document.getElementById('redeem-code-' + redeemPassBtn.dataset.redeemPass);
    if (!r || !input) return;
    const session = redeemPass(r, input.value, user);
    if (session) { alert('✓ Pass redeemed — you\'re checked in!'); render(); }
    else alert('That code is invalid or already used.');
    return;
  }

  // Demo city location (always works without GPS)
  const demoLoc = e.target.closest('[data-demo-loc]');
  if (demoLoc) {
    const [lat, lng] = demoLoc.dataset.demoLoc.split(',').map(Number);
    loadRestroomsForLocation(lat, lng, 50);
    return;
  }

  // Build route plan
  if (e.target.closest('[data-build-route]')) {
    const dest = document.getElementById('route-dest')?.value?.trim();
    const corridor = parseFloat(document.getElementById('route-corridor')?.value || '1.5');
    const statusEl = document.getElementById('route-status');
    if (!dest) { alert('Enter a destination'); return; }
    if (statusEl) statusEl.textContent = 'Geocoding & routing…';
    const btn = e.target.closest('[data-build-route]');
    if (btn) { btn.disabled = true; btn.textContent = 'Planning…'; }
    buildRoutePlan(dest, corridor).then(() => {
      render();
    }).catch(err => {
      console.warn(err);
      if (statusEl) statusEl.textContent = 'Error: ' + (err.message || 'route failed');
      else alert(err.message || 'Route failed');
      if (btn) { btn.disabled = false; btn.textContent = 'Build route plan'; }
    });
    return;
  }

  // Export route
  const expRoute = e.target.closest('[data-export-route]');
  if (expRoute) {
    exportRoutePlan(expRoute.dataset.exportRoute);
    return;
  }

  // Open suggest location modal
  if (e.target.closest('[data-open-suggest]')) {
    if (!currentUser()) { alert('Log in to suggest a location.'); return; }
    root.insertAdjacentHTML('beforeend', suggestModal());
    return;
  }

  // Submit location suggestion / report
  if (e.target.closest('[data-submit-suggest]')) {
    const user = currentUser();
    if (!user) return;
    const name = document.getElementById('sug-name')?.value?.trim();
    const address = document.getElementById('sug-addr')?.value?.trim() || '';
    const lat = parseFloat(document.getElementById('sug-lat')?.value);
    const lng = parseFloat(document.getElementById('sug-lng')?.value);
    const accessible = !!document.getElementById('sug-accessible')?.checked;
    const changing = !!document.getElementById('sug-changing')?.checked;
    const amenities = [...document.querySelectorAll('.sug-amenity:checked')].map(x => x.value);
    if (!name) { alert('Please enter a name.'); return; }
    if (Number.isNaN(lat) || Number.isNaN(lng)) {
      alert('Please enter coordinates (use “Use My Location” on Maps first, or type lat/lng).');
      return;
    }
    // Avoid exact duplicates of existing restrooms
    const key = normalizePlaceKey(name, address);
    const existing = state.restrooms.find(r => normalizePlaceKey(r.name, r.address) === key);
    if (existing) {
      alert('This place is already listed: ' + existing.name);
      document.querySelector('.modal-overlay')?.remove();
      return;
    }
    if (!state.reports) state.reports = [];
    const premium = isPremiumUser(user);

    if (premium) {
      const report = {
        id: 'rep' + Date.now(), name, address, lat, lng, accessible, changing,
        amenities, reporters: [user.id], status: 'pending', premiumDirect: true
      };
      state.reports.push(report);
      const restroom = promoteReportToRestroom(report);
      const earned = grantPoints(user, 25, 'add-location');
      pushActivity({type:'location', userId:user.id, user:user.name, text:`added a new restroom: ${name} (+${earned} pts)`, restroomId:restroom.id});
      save();
      document.querySelector('.modal-overlay')?.remove();
      selected = restroom;
      tab = 'Details';
      alert(`Location published! +${earned} points earned.`);
      render();
      return;
    }

    // Free user: community report (need 3 unique reporters)
    let report = state.reports.find(r => r.status === 'pending' && normalizePlaceKey(r.name, r.address) === key);
    if (!report) {
      // Also match nearby same name within ~0.05 mi if no address
      report = state.reports.find(r => r.status === 'pending' && normalizePlaceKey(r.name, '') === normalizePlaceKey(name, ''));
    }
    if (!report) {
      report = {
        id: 'rep' + Date.now(), name, address, lat, lng, accessible, changing,
        amenities, reporters: [], status: 'pending', premiumDirect: false
      };
      state.reports.push(report);
    } else if (amenities.length) {
      report.amenities = Array.from(new Set([...(report.amenities || []), ...amenities]));
    }
    if (report.reporters.includes(user.id)) {
      alert('You already reported this location. Need ' + Math.max(0, 3 - report.reporters.length) + ' more unique reporter(s).');
      document.querySelector('.modal-overlay')?.remove();
      return;
    }
    report.reporters.push(user.id);
    // Prefer average of coords as more people report
    report.lat = (report.lat * (report.reporters.length - 1) + lat) / report.reporters.length;
    report.lng = (report.lng * (report.reporters.length - 1) + lng) / report.reporters.length;
    const earned = grantPoints(user, 5, 'report-location');
    pushActivity({type:'location', userId:user.id, user:user.name, text:`reported a restroom: ${name} (${report.reporters.length}/3)`});

    if (report.reporters.length >= 3) {
      const restroom = promoteReportToRestroom(report);
      // Bonus for all reporters when it goes live
      report.reporters.forEach(uid => {
        const u = state.users.find(x => x.id === uid);
        if (u) grantPoints(u, 15, 'community-confirm');
      });
      pushActivity({type:'location', userId:user.id, user:'Community', text:`confirmed a new restroom: ${name} (3 reports)`});
      save();
      document.querySelector('.modal-overlay')?.remove();
      selected = restroom;
      tab = 'Details';
      alert(`Thanks! This was the 3rd report — "${name}" is now live. +${earned} pts for your report (+15 community bonus).`);
      render();
      return;
    }

    save();
    document.querySelector('.modal-overlay')?.remove();
    alert(`Report submitted (${report.reporters.length}/3). +${earned} points. ${3 - report.reporters.length} more unique report(s) needed to publish.`);
    render();
    return;
  }

  // Directions (Premium)
  if (e.target.closest('[data-directions]')) {
    const user = currentUser();
    if (!isPremiumUser(user)) {
      alert('Get Directions is a Premium feature. Upgrade from Profile → Subscription.');
      return;
    }
    openDirections(selected || state.restrooms[0]);
    return;
  }

  // Social section tabs
  const socialSec = e.target.closest('[data-social-section]');
  if (socialSec) {
    socialSection = socialSec.dataset.socialSection;
    render();
    return;
  }

  // Start mini-game
  const gameStart = e.target.closest('[data-game-start]');
  if (gameStart) {
    const user = currentUser();
    if (!user) { alert('Log in to play.'); return; }
    const kind = gameStart.dataset.gameStart;
    if (kind === 'quiz' || kind === 'trivia') startQuizGame(kind);
    else if (kind === 'match') startMatchGame();
    else if (kind === 'biz-ops') {
      if (!isBusinessAccount(user)) { alert('Business Ops Challenge is for business accounts.'); return; }
      startBizOpsGame();
    } else if (kind === 'duel-menu') {
      socialSection = 'games';
      gameState = null;
      render();
      return;
    } else if (kind === 'spin') {
      const res = spinWheel();
      if (res && res.error) { alert(res.error); return; }
    }
    socialSection = 'games';
    render();
    return;
  }

  const duelStart = e.target.closest('[data-duel-start]');
  if (duelStart) {
    const user = currentUser();
    if (!user || !isPaidUser(user)) { alert('Clean Duel requires Premium, Fleet, Enterprise, or Business.'); return; }
    startDuel(duelStart.dataset.duelStart);
    socialSection = 'games';
    render();
    return;
  }

  if (e.target.closest('[data-game-quit]')) {
    gameState = null;
    render();
    return;
  }

  const quizAns = e.target.closest('[data-quiz-answer]');
  if (quizAns) {
    answerQuiz(parseInt(quizAns.dataset.quizAnswer, 10));
    render();
    return;
  }

  const matchTile = e.target.closest('[data-match-tile]');
  if (matchTile) {
    if (gameState && gameState.lock) return;
    flipMatchTile(parseInt(matchTile.dataset.matchTile, 10));
    render();
    return;
  }

  // Kudos
  const kudosBtn = e.target.closest('[data-kudos]');
  if (kudosBtn) {
    const user = currentUser();
    if (!user) { alert('Log in first.'); return; }
    const targetId = kudosBtn.dataset.kudos;
    const target = state.users.find(u => u.id === targetId);
    if (!target || target.id === user.id) return;
    if (!areMutuals(user,target)) { alert('Kudos are available to mutual Kleenest friends.'); return; }
    if (!state.kudosLog) state.kudosLog = {};
    const day = new Date().toDateString();
    const key = user.id + '>' + targetId + '>' + day;
    if (state.kudosLog[key]) { alert('You already sent kudos to them today.'); return; }
    state.kudosLog[key] = true;
    ensureGameStats(user).kudosGiven = (ensureGameStats(user).kudosGiven || 0) + 1;
    ensureGameStats(target).kudosReceived = (ensureGameStats(target).kudosReceived || 0) + 1;
    grantPoints(target, 2);
    pushActivity({ type: 'kudos', userId: user.id, user: user.name, text: `sent kudos to ${target.name}` });
    addNotification(target.id,'kudos',`sent you kudos and +2 points.`,user.id);
    save();
    alert(`👏 Kudos sent to ${target.name}! They earned +2 pts.`);
    render();
    return;
  }

  // Challenge friend
  const chal = e.target.closest('[data-challenge]');
  if (chal) {
    const user = currentUser();
    if (!user) { alert('Log in first.'); return; }
    const target = state.users.find(u => u.id === chal.dataset.challenge);
    if (!target) return;
    if (!areMutuals(user,target)) { alert('Challenges are available when you both follow each other.'); return; }
    const ctype = chal.dataset.challengeType || 'streak';
    const labels = { streak: 'a streak challenge', checkins: 'a check-in challenge', quiz: 'a quiz showdown' };
    pushActivity({ type:'challenge', userId:user.id, user:user.name, text:`challenged ${target.name} to ${labels[ctype] || 'a challenge'}!` });
    addNotification(target.id,'challenge',`challenged you to ${labels[ctype] || 'a challenge'}!`,user.id);
    save();
    alert(`⚔️ Challenge sent to ${target.name}!`);
    render();
    return;
  }

  // Join contest
  const joinC = e.target.closest('[data-join-contest]');
  if (joinC) {
    const user = currentUser();
    if (!user) { alert('Log in to join contests.'); return; }
    const c = CONTESTS.find(x => x.id === joinC.dataset.joinContest) || BUSINESS_CONTESTS.find(x => x.id === joinC.dataset.joinContest);
    if (!c) return;
    if (c.premiumOnly && !isPremiumUser(user)) { alert('This contest requires Premium.'); return; }
    if (c.businessOnly && !user.isBusinessUser) { alert('This contest is for business accounts.'); return; }
    ensureAntiCheat(user);
    if (!state.contestEntries) state.contestEntries = {};
    if (!state.contestEntries[c.id]) state.contestEntries[c.id] = [];
    if (!state.contestEntries[c.id].includes(user.id)) {
      state.contestEntries[c.id].push(user.id);
      user.joinedContests[c.id] = Date.now();
      // Reset contest tallies when first joining any contest session metrics start from join
      if (!user.contestTallies) user.contestTallies = { checkins: 0, reviews: 0, firstReviews: 0, replies: 0, pointsEarned: 0 };
      pushActivity({type:'badge', userId:user.id, user:user.name, text:`entered contest: ${c.title}`});
      save();
    }
    alert(`You're entered in "${c.title}"!\nPrize: ${c.prize}\n\nAnti-cheat: only actions after joining count toward this contest.`);
    render();
    return;
  }

  // Claim contest prize → redemption modal
  const claimC = e.target.closest('[data-claim-contest]');
  if (claimC) {
    const user = currentUser();
    if (!user) return;
    const c = CONTESTS.find(x => x.id === claimC.dataset.claimContest) || BUSINESS_CONTESTS.find(x => x.id === claimC.dataset.claimContest);
    if (!c) return;
    const gate = canClaimContest(user, c);
    if (!gate.ok) { alert(gate.reason); return; }
    if (!user.badges) user.badges = [];
    if (!user.badges.includes('Contest Winner')) user.badges.push('Contest Winner');
    user.claimedContestIds.push(c.id);
    if (!state.claimedRewards) state.claimedRewards = [];
    const code = 'PRIZE-' + c.id.toUpperCase() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    state.claimedRewards.push({userId:user.id, rewardId:c.id, title:c.prize, code, at: new Date().toLocaleDateString(), type:'contest'});
    const bonus = grantPoints(user, 25, 'contest-bonus');
    save();
    render();
    root.insertAdjacentHTML('beforeend', prizeModal({
      title: c.prize,
      code,
      subtitle: `Contest: ${c.title} · Score ${gate.score}`,
      pointsNote: `+${bonus} bonus points added to your account.`,
      shareText: `I won "${c.prize}" in the Kleenest contest "${c.title}"! 🏆`
    }));
    return;
  }

  // Redeem store reward → redemption modal
  const redeem = e.target.closest('[data-redeem]');
  if (redeem) {
    const user = currentUser();
    if (!user) { alert('Log in to redeem rewards.'); return; }
    const rw = REWARD_CATALOG.find(x => x.id === redeem.dataset.redeem);
    if (!rw) return;
    if ((user.points || 0) < rw.cost) { alert(`Need ${rw.cost} points (you have ${user.points || 0}).`); return; }
    user.points -= rw.cost;
    user.level = levelFromPoints(user.points);
    if (rw.type === 'premium') user.subscriptionLevel = 'Premium';
    if (rw.type === 'badge') {
      user.badges = user.badges || [];
      if (!user.badges.includes('Support Hero')) user.badges.push('Support Hero');
    }
    if (!state.claimedRewards) state.claimedRewards = [];
    const code = 'RWD-' + Math.random().toString(36).slice(2, 10).toUpperCase();
    state.claimedRewards.push({userId:user.id, rewardId:rw.id, code, at: new Date().toLocaleDateString(), type:'store'});
    save();
    render();
    root.insertAdjacentHTML('beforeend', prizeModal({
      title: rw.title,
      code,
      subtitle: `Rewards store · ${rw.cost} points spent`,
      pointsNote: `Remaining balance: ${user.points} points.`,
      shareText: `I just redeemed "${rw.title}" on Kleenest with my points! 🎁`
    }));
    return;
  }

  // Copy / share prize
  const copyCode = e.target.closest('[data-copy-code]');
  if (copyCode) {
    const code = copyCode.dataset.copyCode;
    navigator.clipboard?.writeText(code).then(() => alert('Code copied!')).catch(() => prompt('Copy this code:', code));
    return;
  }
  const copyShare = e.target.closest('[data-copy-share]');
  if (copyShare) {
    const msg = decodeURIComponent(copyShare.dataset.copyShare);
    navigator.clipboard?.writeText(msg).then(() => alert('Message copied!')).catch(() => prompt('Copy:', msg));
    return;
  }
  const sharePrize = e.target.closest('[data-share-prize]');
  if (sharePrize) {
    const msg = decodeURIComponent(sharePrize.dataset.sharePrize);
    if (navigator.share) {
      navigator.share({ title: 'Kleenest prize', text: msg }).catch(() => {});
    } else {
      navigator.clipboard?.writeText(msg).then(() => alert('Share text copied — paste anywhere!')).catch(() => prompt('Share:', msg));
    }
    return;
  }

  // Notifications
  const notificationBtn = e.target.closest('[data-notifications]');
  if (notificationBtn) {
    const user=currentUser(); if(!user) return;
    root.insertAdjacentHTML('beforeend', notificationsModal());
    markNotificationsRead(user);
    return;
  }
  const markNotes = e.target.closest('[data-mark-notifications]');
  if (markNotes) { markNotificationsRead(currentUser()); document.querySelector('.modal-overlay')?.remove(); render(); return; }

  // Open a community member profile
  const profileBtn = e.target.closest('[data-user-profile]');
  if (profileBtn) {
    const target = userById(profileBtn.dataset.userProfile);
    if (!target) return;
    root.insertAdjacentHTML('beforeend', userProfileModal(target.id));
    return;
  }

  // Mutual-friend messaging
  const messageBtn = e.target.closest('[data-message-user]');
  if (messageBtn) {
    const user = currentUser(), target = userById(messageBtn.dataset.messageUser);
    if (!user || !target) return;
    if (!areMutuals(user,target)) { alert('Messaging is available when you both follow each other.'); return; }
    root.insertAdjacentHTML('beforeend', messageModal(target.id));
    return;
  }

  const sendMessage = e.target.closest('[data-send-message]');
  if (sendMessage) {
    const user=currentUser(), target=userById(sendMessage.dataset.sendMessage), text=(document.getElementById('message-text')?.value||'').trim();
    if (!user||!target||!areMutuals(user,target)) { alert('You can message mutual friends only.'); return; }
    if (text.length<1) { alert('Write a message first.'); return; }
    state.messages.push({id:'m'+Date.now(),fromId:user.id,toId:target.id,text,ts:Date.now(),read:false});
    addNotification(target.id,'message',`sent you a message.`,user.id);
    pushActivity({type:'message',userId:user.id,user:user.name,text:`messaged ${target.name}`});
    save();
    document.querySelector('.modal-overlay')?.remove();
    alert('Message sent to '+target.name+'.');
    return;
  }

  // Create a follower-only community post
  const createPost = e.target.closest('[data-create-post]');
  if (createPost) {
    const user=currentUser(), text=(document.getElementById('social-post-text')?.value||'').trim();
    if (!user) { alert('Log in to post.'); return; }
    if (text.length<3) { alert('Write a little more first.'); return; }
    const postId='sp'+Date.now();
    state.socialPosts.unshift({id:postId,userId:user.id,text,ts:Date.now(),likes:[],comments:[]});
    (user.followers||[]).forEach(fid=>addNotification(fid,'post',`${user.name} shared a new community post.`,user.id,{postId}));
    pushActivity({type:'post',userId:user.id,user:user.name,text:'shared a post with their Kleenest community'});
    save(); render(); return;
  }

  // Like a community post
  const likePost = e.target.closest('[data-like-post]');
  if (likePost) {
    const user=currentUser(); const post=(state.socialPosts||[]).find(p=>p.id===likePost.dataset.likePost);
    if (!user||!post) return;
    post.likes=post.likes||[]; const i=post.likes.indexOf(user.id);
    if(i>=0) post.likes.splice(i,1); else { post.likes.push(user.id); pushActivity({type:'like',userId:user.id,user:user.name,text:`liked a community post`}); addNotification(post.userId,'like',`liked your community post.`,user.id,{postId:post.id}); }
    save(); render(); return;
  }

  // Open comments on community posts
  const commentPost = e.target.closest('[data-comment-post]');
  if (commentPost) {
    const user=currentUser(), post=(state.socialPosts||[]).find(p=>p.id===commentPost.dataset.commentPost);
    if(!user||!post) return;
    root.insertAdjacentHTML('beforeend', commentsModal(post.id));
    return;
  }

  const submitComment = e.target.closest('[data-submit-comment]');
  if (submitComment) {
    const user=currentUser(), post=(state.socialPosts||[]).find(p=>p.id===submitComment.dataset.submitComment);
    const text=(document.getElementById('comment-text')?.value||'').trim();
    if(!user||!post||!text) { alert('Write a comment first.'); return; }
    const author=userById(post.userId);
    const allowed=post.userId===user.id || followsUser(user,author) || followsUser(author,user);
    if(!allowed){ alert('Follow this person to interact with their posts.'); return; }
    post.comments=post.comments||[];
    post.comments.push({id:'pc'+Date.now(),userId:user.id,user:user.name,text,ts:Date.now()});
    if(author && author.id!==user.id) addNotification(author.id,'comment',`commented on your community post.`,user.id,{postId:post.id});
    pushActivity({type:'reply',userId:user.id,user:user.name,text:`commented on ${author?author.name:'a member'}'s post`});
    save();
    document.querySelector('.modal-overlay')?.remove();
    root.insertAdjacentHTML('beforeend', commentsModal(post.id));
    return;
  }

  // Follow / unfollow
  const followBtn = e.target.closest('[data-follow]');
  if (followBtn) {
    const user = currentUser();
    if (!user) { alert('Log in to follow people.'); return; }
    const targetId = followBtn.dataset.follow;
    const target = state.users.find(u => u.id === targetId);
    if (!target) return;
    user.following = user.following || [];
    target.followers = target.followers || [];
    const idx = user.following.indexOf(targetId);
    if (idx >= 0) {
      user.following.splice(idx, 1);
      target.followers = target.followers.filter(id => id !== user.id);
    } else {
      user.following.push(targetId);
      if (!target.followers.includes(user.id)) target.followers.push(user.id);
      pushActivity({type:'follow', userId:user.id, user:user.name, text:`started following ${target.name}`});
      addNotification(target.id,'follow',`started following you.`,user.id);
      if (areMutuals(user,target)) addNotification(target.id,'follow',`You and ${user.name} are now Kleenest friends. You can message, send kudos and challenge each other.`,user.id);
    }
    save();
    render();
    return;
  }

  // Like review
  const likeBtn = e.target.closest('[data-like-review]');
  if (likeBtn) {
    const user = currentUser();
    if (!user) { alert('Log in to like reviews.'); return; }
    const rid = likeBtn.dataset.likeReview;
    let review = null;
    for (const list of Object.values(state.reviews)) {
      review = list.find(r => r.id === rid);
      if (review) break;
    }
    if (!review) return;

      const chosenAmenities = [...document.querySelectorAll('.rev-amenity:checked')].map(x => x.value);
      if (chosenAmenities.length) {
        selected.amenities = Array.from(new Set([...(selected.amenities || []), ...chosenAmenities]));
      }
    }
    const basePts = 5 + (photos.length ? 5 : 0);
    const wasUnrated = isUnrated(selected);
    const ac = recordContestAction(user, 'review');
    if (!ac.ok) { alert(ac.reason); return; }
    const earned = grantPoints(user, basePts, 'review');
    user.totalReviews = (user.totalReviews || 0) + 1;
    if (wasUnrated) {
      user.firstReviews = (user.firstReviews || 0) + 1;
      if (user.contestTallies && Object.keys(user.joinedContests || {}).length) {
        user.contestTallies.firstReviews = (user.contestTallies.firstReviews || 0) + 1;
      }
    }
    if (user.contestTallies) user.contestTallies.pointsEarned = (user.contestTallies.pointsEarned || 0) + earned;
    pushActivity({type:'review', userId:user.id, user:user.name, text:`left a ${reviewStars}-star review at ${selected.name}${photos.length ? ' with photos' : ''} (+${earned} pts)`, restroomId:selected.id});
    save();
    document.querySelector('.modal-overlay')?.remove();
    alert(`Review submitted! +${earned} points earned`);
    render();
    return;
  }

  // Legal
  const legal = e.target.closest('[data-legal]');
  if (legal) {
    root.insertAdjacentHTML('beforeend', legalModal(legal.dataset.legal));
    return;
  }

  // Close modal
  // Close modals: Cancel/Close buttons OR click on dimmed backdrop only
  if (e.target.closest('[data-close-modal]')) {
    e.preventDefault();
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    return;
  }
  if (e.target.classList.contains('modal-overlay')) {
    e.target.remove();
    return;
  }

  // Admin actions
  const approve = e.target.closest('[data-approve]');
  if (approve) {
    const rest = state.restrooms.find(x => x.id === approve.dataset.approve);
    if (rest) {
      rest.verificationStatus = 'verified';
      rest.verified = true;
      const owner = rest.ownerId ? state.users.find(u => u.id === rest.ownerId) : null;
      if (owner) { owner.verificationStatus = 'verified'; }
      (state.verificationRequests || []).filter(x => x.restroomId === rest.id && x.status === 'pending').forEach(x => { x.status='approved'; x.reviewedAt=Date.now(); x.reviewedBy=currentUser()?.id||null; });
      if (owner) {
        state.notifications.push({id:'n'+Date.now(),userId:owner.id,type:'verification',text:`${rest.name} is now Kleenest Verified.`,at:Date.now(),read:false});
      }
      save();
      render();
    }
    return;
  }
  const delR = e.target.closest('[data-delete-restroom]');
  if (delR) {
    if (!confirm('Remove this restroom?')) return;
    state.restrooms = state.restrooms.filter(x => x.id !== delR.dataset.deleteRestroom);
    save();
    render();
    return;
  }
  const togAdmin = e.target.closest('[data-toggle-admin]');
  if (togAdmin) {
    const u = state.users.find(x => x.id === togAdmin.dataset.toggleAdmin);
    if (u) { u.isAdmin = true; save(); render(); }
    return;
  }
  if (e.target.closest('[data-seed-admin]')) {
    if (state.users.some(x => x.email === 'admin@kleenest.app')) {
      alert('Admin already exists. Log in with admin@kleenest.app / admin123');
      return;
    }
    state.users.push({
      id: 'u-admin', name: 'Kleenest Admin', email: 'admin@kleenest.app', password: 'admin123',
      isBusinessUser: true, isAdmin: true, points: 0, badges: ['Admin'], subscriptionLevel: 'Business',
      avatar: '🛡️', joinDate: 'Aug 2026', totalCheckIns: 0, totalReviews: 0, businessName: null, verificationStatus: null
    });
    save();
    alert('Admin created. Log in with admin@kleenest.app / admin123');
    render();
    return;
  }

  // Switches (visual only)
  if (e.target.closest('[data-switch]')) {
    e.target.closest('[data-switch]').classList.toggle('on');
  }
});

function applyFilters() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  const active = [...document.querySelectorAll('[data-filter].active')].map(x => x.dataset.filter);
  const user = currentUser();
  const list = state.restrooms.filter(x => {
    if (!(x.name + x.address).toLowerCase().includes(q)) return false;
    if (active.includes('accessible') && !x.accessible) return false;
    if (active.includes('unrated') && !isUnrated(x)) return false;
    if (active.includes('rating') && (isUnrated(x) || x.rating < 4)) return false;
    if (active.includes('recent') && (isUnrated(x) || x.cleanlinessPct < 85)) return false;
    if (active.includes('verified') && !x.verified) return false;
    if (active.includes('myfavorites') && !isFavorited(user, x.id)) return false;
    if (active.includes('premium') && !x.isPremium) return false;
    if (active.includes('changing') && !x.changing) return false;
    for (const a of active) {
      if (a.startsWith('amenity:')) {
        const name = a.slice(8);
        if (!(x.amenities || []).includes(name)) return false;
      }
    }
    return true;
  });
  const results = document.getElementById('results');
  if (results) results.innerHTML = list.map(item).join('') || '<p style="text-align:center;color:var(--ink-soft)">No restrooms match your filters.</p>';
}

function loadReviewPhotosFromInput(input) {
  const files = [...(input.files || [])].filter(f => f.type && f.type.startsWith('image/')).slice(0, 3);
  reviewPhotos = [];
  const row = document.getElementById('photo-preview-row');
  const status = document.getElementById('photo-status');
  const clearBtn = document.getElementById('clear-review-photos');
  if (row) row.innerHTML = '';
  if (!files.length) {
    if (status) status.textContent = 'No photos selected';
    if (clearBtn) clearBtn.style.display = 'none';
    return;
  }
  if (status) status.textContent = `Loading ${files.length} photo${files.length > 1 ? 's' : ''}…`;
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      reviewPhotos.push(ev.target.result);
      if (row) {
        const img = document.createElement('img');
        img.src = ev.target.result;
        img.alt = 'Preview';
        img.style.cssText = 'width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--tile-line)';
        row.appendChild(img);
      }
      pending--;
      if (pending <= 0) {
        if (status) status.textContent = `${reviewPhotos.length} photo${reviewPhotos.length > 1 ? 's' : ''} ready`;
        if (clearBtn) clearBtn.style.display = '';
      }
    };
    reader.onerror = () => {
      pending--;
      if (status) status.textContent = 'Could not read one of the images.';
    };
    reader.readAsDataURL(file);
  });
}

document.addEventListener('change', e => {
  if (e.target.id === 'review-photo') {
    loadReviewPhotosFromInput(e.target);
    return;
  }
  if (e.target.id === 'biz-location-photo' || e.target.id === 'biz-vr-photo') {
    const input=e.target;
    const files=[...(input.files||[])].filter(f=>f.type&&f.type.startsWith('image/'));
    const previewId=input.id==='biz-vr-photo'?'biz-vr-preview':'biz-loc-preview';
    const preview=document.getElementById(previewId);
    if(!files.length) return;
    if(input.id==='biz-vr-photo') {
      readImageDataUrl(files[0],2400,.82).then(data=>{ input.dataset.dataUrl=data; if(preview) preview.innerHTML=`<img src="${data}" alt="VR preview" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px">`; });
    } else {
      Promise.all(files.slice(0,8).map(f=>readImageDataUrl(f,1600,.80))).then(datas=>{
        window._bizLocPhotos=datas;
        if(preview) preview.innerHTML=datas.map(src=>`<img src="${src}" alt="Location" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--tile-line)">`).join('');
      });
    }
    return;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'search') {
    applyFilters();
  }
  if (e.target.id === 'biz-claim-search') {
    const q=(e.target.value||'').trim().toLowerCase();
    document.querySelectorAll('.biz-claim-row').forEach(row=>{ row.style.display=!q || (row.dataset.search||'').includes(q) ? '' : 'none'; });
  }
  if (e.target.id === 'biz-location-count') {
    const wasSelected = document.querySelector('.plan-card.selected')?.dataset.plan;
    bizLocations = Math.max(1, Math.min(50, parseInt(e.target.value, 10) || 1));
    document.querySelector('.modal-overlay')?.remove();
    root.insertAdjacentHTML('beforeend', subscribeModal());
    if (wasSelected) document.querySelector(`.plan-card[data-plan="${wasSelected}"]`)?.classList.add('selected');
    return;
  }
  if (e.target.id === 'family-addon-check') {
    familyAddon = e.target.checked;
    return;
  }
});

// Only surface the red banner for true startup failures — not every map tile /
// CORS / geolocation noise that fires later while tabs are in use.
let kleenestStarted = false;
window.addEventListener('error', function(ev) {
  console.error('Kleenest runtime error:', ev.error || ev.message);
  if (!kleenestStarted) {
    const box = document.getElementById('startup-error');
    if (box) box.style.display = 'block';
  }
});
window.addEventListener('unhandledrejection', function(ev) {
  console.error('Kleenest promise error:', ev.reason);
  // Never flash the full-page startup banner for async network/map noise
});

// Start on Maps so a shared link immediately shows nearby results after GPS
tab = 'Maps';

try {
  render();
  kleenestStarted = true;
  const box = document.getElementById('startup-error');
  if (box) box.style.display = 'none';
  // Request GPS right away so results sort by the visitor's real position
  setTimeout(autoLocateOnLoad, 200);
  processIncoming();
} catch (err) {
  console.error('Kleenest startup error:', err);
  const box = document.getElementById('startup-error');
  if (box) {
    box.style.display = 'block';
    box.innerHTML = '<h2>Kleenest could not start</h2><p>' + (err && err.message ? String(err.message) : 'Unknown error') + '</p><p>Refresh the page. If it continues, clear site data for this origin and try again.</p>';
  }
}
</script>
