<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kleenest — Find the cleanest places nearby</title><meta name="theme-color" content="#0E7C6B"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>:root{--ink:#16211D;--muted:#5B6D66;--bg:#F6F9F7;--surface:#fff;--teal:#0E7C6B;--line:#D8DFDC;--blue:#3E7C99;--green:#27AE60}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:1180px;margin:auto;min-height:100vh;background:var(--surface)}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:8px}.brand>b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff}.brand span{font-size:1.2rem;font-weight:800;color:#0A5C4F}.brand small{font-size:.65rem;font-weight:800;color:var(--blue);border:1px solid var(--line);border-radius:99px;padding:3px 6px}nav{display:flex;gap:5px;overflow:auto}nav button{border:0;background:transparent;padding:9px 12px;border-radius:99px;color:var(--muted);font-weight:700;white-space:nowrap}nav button.active{background:var(--teal);color:#fff}.auth-button{border:1px solid var(--teal);color:var(--teal);background:#fff}main{padding:20px 16px 70px}.stack{display:flex;flex-direction:column;gap:14px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3,p{margin:0}h1{font-size:1.7rem}h3{font-size:1.05rem}.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;box-shadow:0 2px 8px #16211d0b}.card.accent{border-left:4px solid var(--teal);background:#e4f2ee}.card.blue{border-left:4px solid var(--blue);background:#e8f1f5}.primary,.secondary,.success,.ghost{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.ghost{background:#e8eeee;color:var(--ink)}.filters,.actions,.stats,.route-actions{display:flex;gap:8px;flex-wrap:wrap}.filters{overflow:auto;flex-wrap:nowrap;padding:3px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 13px;color:var(--muted);font-weight:700;cursor:pointer}.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}.map-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:14px}#map{height:520px;border:1px solid var(--line);border-radius:16px}.results{max-height:520px;overflow:auto}.place{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}.place strong,.place span,.place em{display:block}.place span{font-size:.82rem;color:var(--muted);margin-top:3px}.place em{font-size:.72rem;color:var(--teal);font-style:normal;font-weight:700;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:1.25rem;color:#0A5C4F}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.muted{color:var(--muted)}.message-banner.error{background:#fdebea;color:#9f3325;padding:10px;border-radius:10px}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}nav{width:100%}.map-layout{grid-template-columns:1fr}#map{height:390px}.results{max-height:none}.stats{grid-template-columns:1fr 1fr}}</style><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="kleenest-supabase.js"></script><script src="kleenest-runtime.js"></script><script src="kleenest-location.js"></script><script src="kleenest-actions.js"></script><script src="kleenest-reviews.js"></script><script src="kleenest-rewards.js"></script><script src="kleenest-account.js"></script><script src="kleenest-promotions.js"></script><script src="kleenest-osm-discovery.js"></script><script src="kleenest-map-discovery-bootstrap.js"></script><script src="kleenest-business-surface.js"></script><script src="kleenest-business-analytics.js"></script><script src="kleenest-business-dashboard.js"></script><script src="kleenest-business-workspace.js"></script><script src="kleenest-business-admin-complete.js"></script><script src="kleenest-business-runtime-fix.js"></script><script src="kleenest-business-navigation.js"></script><script src="kleenest-admin-surface.js"></script><script src="kleenest-business-intelligence.js"></script><script src="kleenest-enterprise.js"></script><script src="kleenest-auth.js"></script><script src="kleenest-auth-ui.js"></script><script src="kleenest-modular-entry.js"></script><script src="kleenest-auth-bridge.js"></script></head><body><div class="app"><div id="modular-root"></div></div></body></html>
