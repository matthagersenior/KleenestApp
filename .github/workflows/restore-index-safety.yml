name: Protect and wire Kleenest frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  protect-and-wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and wire frontend safely
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo 'index.html missing; restoring known-good frontend.'
            git checkout 7ffd4895a9bbcd546f7316eb8ec46230e4062f36 -- index.html
          else
            lines=$(wc -l < index.html | tr -d ' ')
            bytes=$(wc -c < index.html | tr -d ' ')
            echo "index.html: ${lines} lines, ${bytes} bytes"
            if [ "$lines" -lt 1000 ] || [ "$bytes" -lt 100000 ]; then
              git checkout 7ffd4895a9bbcd546f7316eb8ec46230e4062f36 -- index.html
            fi
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          supabase = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          bridge = '<script src="supabase-client.js"></script>'
          if supabase not in s:
              marker = '<style>'
              if marker in s:
                  s = s.replace(marker, supabase + '\n' + marker, 1)
              else:
                  s = s.replace('</head>', supabase + '\n</head>', 1)
          if bridge not in s:
              marker = '</head>'
              s = s.replace(marker, bridge + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore and wire complete Kleenest frontend' || exit 0
          git push
