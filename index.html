<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kleenest — Modular</title>
<meta name="theme-color" content="#0E7C6B">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--ink:#16211D;--muted:#5B6D66;--bg:#F6F9F7;--surface:#fff;--teal:#0E7C6B;--line:#D8DFDC;--blue:#3E7C99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:1180px;margin:auto;min-height:100vh;background:var(--surface);box-shadow:0 8px 35px #16211d14}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:8px}.brand>b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff}.brand span{font-size:1.2rem;font-weight:800;color:#0A5C4F}.brand small{font-size:.65rem;font-weight:800;color:var(--blue);border:1px solid var(--line);border-radius:99px;padding:3px 6px}nav{display:flex;gap:5px;overflow:auto}nav button{border:0;background:transparent;padding:9px 12px;border-radius:99px;color:var(--muted);font-weight:700;white-space:nowrap}nav button.active{background:var(--teal);color:#fff}main{padding:20px 16px 70px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0 0 5px;font-size:1.7rem}p{color:var(--muted)}button{font:inherit;cursor:pointer}.primary,.secondary{border:0;border-radius:10px;padding:11px 15px;font-weight:800}.primary{background:var(--teal);color:#fff}.secondary{background:#e8f1f5;color:#245a70}.filters{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 13px;color:var(--muted);font-weight:700}.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}.map-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:14px}#map{height:540px;border:1px solid var(--line);border-radius:16px}.results{max-height:540px;overflow:auto}.count{font-weight:800;color:var(--muted);padding:4px 2px 8px}.place{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.place:hover{border-color:var(--teal)}.place strong,.place span,.place em{display:block}.place span{font-size:.82rem;color:var(--muted);margin-top:3px}.place em{font-size:.72rem;color:var(--teal);font-style:normal;font-weight:700;margin-top:5px}.place>b{white-space:nowrap;color:var(--muted);font-size:.8rem}.card{max-width:760px;border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff}.card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.selected-route,.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stats span{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:120px}.stats b{display:block;font-size:1.15rem;color:#0A5C4F}.card li{margin:7px 0}.back{border:0;background:none;color:var(--teal);font-weight:800;margin-bottom:10px}.empty{padding:30px 10px;color:var(--muted);text-align:center}footer{text-align:center;color:var(--muted);font-size:.75rem;padding:15px;border-top:1px solid var(--line)}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}nav{width:100%}.map-layout{grid-template-columns:1fr}#map{height:390px}.results{max-height:none}}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="kleenest-supabase.js"></script>
<script src="kleenest-runtime.js"></script>
<script src="kleenest-location.js"></script>
<script src="kleenest-osm-discovery.js"></script>
<script src="kleenest-map-discovery-bootstrap.js"></script>
<script src="kleenest-modular-entry.js"></script>
</head>
<body><div class="app"><div id="modular-root"></div></div></body>
</html>
