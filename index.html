<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0E7C6B">
<title>Kleenest — Find the cleanest restroom nearby</title>
<style>:root{--ink:#16211D;--ink-soft:#5B6D66;--porcelain:#F6F9F7;--surface:#FFF;--teal:#0E7C6B;--tile-line:#D8DFDC}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--porcelain);color:var(--ink)}button{font:inherit;cursor:pointer}.card{background:var(--surface);border:1px solid var(--tile-line);border-radius:16px;padding:18px}.muted{color:var(--ink-soft)}#modular-root{min-height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="kleenest-supabase-runtime.js"></script>
<script src="kleenest-design-system-v1.js"></script>
<script src="kleenest-actions.js"></script>
<script src="kleenest-rewards.js"></script>
<script src="kleenest-rewards-history.js"></script>
<script src="kleenest-reviews.js"></script>
<script src="kleenest-promotions.js"></script>
<script src="kleenest-account.js"></script>
<script src="kleenest-business.js"></script>
<script src="kleenest-business-management.js"></script>
<script src="kleenest-business-analytics.js"></script>
<script src="kleenest-business-workspace.js"></script>
<script src="kleenest-ui-integration.js"></script>
<script src="kleenest-platform-admin-core-v3.js"></script>
<script src="kleenest-admin-v3-alias.js"></script>
<script src="kleenest-admin-v3-hotfix.js"></script>
</head>
<body>
<div id="modular-root"><section class="card"><h1>Kleenest</h1><p class="muted">Starting modular app…</p></section></div>
<script>
(function(){
  var root=document.getElementById('modular-root');
  function boot(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('Unable to load '+src))};document.head.appendChild(s)})}
  boot('kleenest-app-shell-v72.js?shell=72-'+Date.now()).catch(function(e){console.error('[Kleenest] authoritative shell bootstrap failed',e);root.innerHTML='<section class="card"><h1>Kleenest</h1><p class="muted">The authoritative app shell could not initialize.</p><button id="retry">Retry</button><p class="muted" style="font-size:.8rem">'+String(e.message||e).replace(/[<>]/g,'')+'</p></section>';document.getElementById('retry').onclick=function(){location.reload()}});
  boot('kleenest-map-preloader.js?preload=72-'+Date.now()).catch(function(e){console.warn('[Kleenest] optional Maps preload unavailable',e)});
})();
</script>
</body>
</html>
