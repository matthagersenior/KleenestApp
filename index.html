></section></div><script>(function(){var root=document.getElementById('modular-root');function fail(e){console.error('[Kleenest] startup failure',e);root.innerHTML='<section class="card"><h1>Kleenest</h1><p>We could not start the app.</p><button id="retry">Retry</button></section>';document.getElementById('retry').onclick=function(){location.reload()}}window.addEventListener('error',function(e){if(!window.KleenestAppShell)fail(e.error||e.message)});window.addEventListener('unhandledrejection',function(e){if(!window.KleenestAppShell)fail(e.reason||e)});setTimeout(function(){if(!window.KleenestAppShell){fail(new Error('App shell did not initialize'))}},8000)})()</script></body></html>
