name: Finish Pass 9 view extraction

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/monolith-removal

permissions:
  contents: write

jobs:
  extract-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Extract VIEWS block from current index.html when still inline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start_marker='/* ========== VIEWS ========== */'
          end_marker='/* ========== MODALS ========== */'
          start=s.find(start_marker)
          end=s.find(end_marker,start)
          if start >= 0 and end > start:
              module=s[start:end]
              Path('kleenest-views.js').write_text(module,encoding='utf-8')
              s=s[:start]+s[end:]
              anchor='<script src="kleenest-ui-integration.js"></script>'
              loader='<script src="kleenest-views.js"></script>'
              if loader not in s:
                  if anchor not in s:
                      raise SystemExit('Could not find UI integration script anchor')
                  s=s.replace(anchor,anchor+'\n'+loader,1)
              p.write_text(s,encoding='utf-8')
              print(f'Extracted {len(module.encode("utf-8")):,} bytes')
          else:
              print('VIEWS block already extracted; leaving kleenest-views.js unchanged.')
          PY

      - name: Install partnership guard into index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          loader='<script src="kleenest-partner-access.js"></script>'
          if loader not in s:
              anchor='<script src="kleenest-views.js"></script>'
              if anchor not in s:
                  raise SystemExit('Could not find kleenest-views.js loader')
              s=s.replace(anchor,anchor+'\n'+loader,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        run: |
          set -euo pipefail
          test -s kleenest-views.js
          test -s kleenest-partner-access.js
          grep -q '<script src="kleenest-views.js"></script>' index.html
          grep -q '<script src="kleenest-partner-access.js"></script>' index.html
          ! grep -q '/\* ========== VIEWS ========== \*/' index.html
          node --check kleenest-views.js
          node --check kleenest-partner-access.js
          echo 'Pass 9 + partnership guard verified.'

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html kleenest-views.js kleenest-partner-access.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Gate preferred locations by partner programs'
          git push
