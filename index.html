<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C6B">
<title>Kleenest — Find the cleanest restroom nearby</title>
<style>
:root{--ink:#16211D;--porcelain:#F6F9F7;--surface:#FFF;--line:#D8DFDC}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:var(--porcelain);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#modular-root{min-height:100vh}.boot{margin:16px auto;max-width:1180px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.boot button{border:0;border-radius:12px;padding:10px 14px;background:#0e7c6b;color:#fff;font-weight:800}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js?boot=20260817-2"></script>
<script src="kleenest-map-preloader.js?boot=20260817-2"></script>
<script src="kleenest-supabase-runtime.js?boot=20260817-2"></script>
</head>
<body>
<div id="modular-root"><section class="boot"><strong>Kleenest</strong><p>Loading the app…</p></section></div>
<script>
(function(){
  'use strict';
  var root=document.getElementById('modular-root');
  function showError(e){
    console.error('[Kleenest boot]',e);
    root.innerHTML='<section class="boot"><h1>Kleenest</h1><p>The app shell failed to start.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+String(e&&e.stack||e&&e.message||e||'Unknown error').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><button onclick="location.reload()">Retry</button></section>';
  }
  var s=document.createElement('script');
  s.src='kleenest-app-shell-v72.js?shell=74-'+Date.now();
  s.async=false;
  s.onload=function(){
    if(!window.KleenestAppShellV72) return showError(new Error('Authoritative app shell loaded but did not register.'));
    console.info('[Kleenest boot] shell ready');
  };
  s.onerror=function(){showError(new Error('Unable to load kleenest-app-shell-v72.js'));};
  document.head.appendChild(s);
})();
</script>
</body>
</html>
