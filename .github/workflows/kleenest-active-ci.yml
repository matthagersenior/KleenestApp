name: Kleenest Active Runtime Gate
on:
  push:
    branches: [refactor/monolith-removal]
  pull_request:
    branches: [refactor/monolith-removal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical runtime syntax
        run: |
          set -euo pipefail
          files=(kleenest-modular-shell-v13.js kleenest-home-core-v1.js kleenest-home-checkin-bridge-v1.js kleenest-qr.js kleenest-account-plans-v1.js kleenest-business-feature-entitlement-enforcer-v3.js kleenest-business-feature-entitlement-enforcer-v2.js kleenest-business-feature-entitlement-enforcer-v1.js kleenest-business-studio-entitlement-guard-v1.js kleenest-business-workspace-v1.js kleenest-business-gap-closer-v2.js kleenest-business-qr-studio-hardener-v1.js kleenest-business-control-center-v5.js kleenest-fleet-workspace-v1.js kleenest-qr-studio-dashboard-v1.js kleenest-admin-canonical-runtime-v3.js kleenest-admin-tools-dashboard-v4.js kleenest-platform-admin-core-v4.js kleenest-data-feature-wiring-v1.js kleenest-location-contribution-bridge-v1.js kleenest-location-details-v1.js kleenest-game-engine-v1.js kleenest-rewards.js kleenest-reviews.js kleenest-promotions.js core/kleenest-tab-core-registry-v2.js cores/home/home-core.js cores/maps/maps-tab-core-v2.js cores/maps/maps-core.js cores/maps/maps-renderer-v2.js cores/business/business-core-v8.js cores/admin/admin-core.js kleenest-maps-dashboard-redesign-v3.js); for f in "${files[@]}"; do test -f "$f"; node --check "$f"; done
      - name: Check known contracts
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude='*.md' 'qr_codes\.business_id' .
          ! grep -RIn --include='*.js' -E 'alert\([^)]*(upgrade|premium|tier|plan|locked|requires)' kleenest-business-feature-entitlement-enforcer-v*.js
          grep -q 'refactor/monolith-removal' .github/workflows/jekyll-gh-pages.yml
      - name: Check active HTML bootstrap
        run: |
          set -euo pipefail
          test -f index.html
          grep -q 'core/kleenest-tab-core-registry-v2.js' index.html
          grep -q 'cores/maps/maps-tab-core-v2.js' index.html
          grep -q 'cores/business/business-core-v8.js' index.html
          grep -q 'cores/admin/admin-core.js' index.html
      - name: Check Maps lifecycle contracts
        run: |
          set -euo pipefail
          grep -q 'MapsCoreV6' cores/maps/maps-core.js
          grep -q 'MapsRendererV2' cores/maps/maps-renderer-v2.js
          grep -q 'kleenest-maps-dashboard-redesign-v3.js' cores/maps/maps-renderer-v2.js
          grep -q 'destroy' cores/maps/maps-core.js
          grep -q 'fitBounds' cores/maps/maps-renderer-v2.js
          grep -q 'catch(error)' kleenest-maps-dashboard-redesign-v3.js
      - name: Check check-in authority contracts
        run: |
          set -euo pipefail
          grep -q 'verify_qr_checkin' supabase/migrations/20260817092000_harden_qr_checkin_rewards_and_geofence.sql
          grep -q 'gps_checkin' supabase/migrations/20260817092000_harden_qr_checkin_rewards_and_geofence.sql
          grep -q 'auth.uid()' supabase/migrations/20260817092000_harden_qr_checkin_rewards_and_geofence.sql
      - name: Check pricing authority contracts
        run: |
          set -euo pipefail
          grep -q 'pricing_authority_v1' kleenest-account-plans-v1.js
          grep -q "code='premium_user'" supabase/migrations/20260817170000_canonical_premium_user_one_time_price.sql
          grep -q "interval='once'" supabase/migrations/20260817170000_canonical_premium_user_one_time_price.sql
      - name: Check Fleet operational contracts
        run: |
          set -euo pipefail
          grep -q 'fleet_dashboard_summary_v2' kleenest-fleet-workspace-v1.js
          grep -q 'KleenestFleetWorkspaceV3' kleenest-fleet-workspace-v1.js
          grep -q 'fleet_set_vehicle_status' kleenest-fleet-workspace-v1.js
          grep -q 'fleet_set_driver_status' kleenest-fleet-workspace-v1.js
          grep -q 'fleet_complete_maintenance' kleenest-fleet-workspace-v1.js
          grep -q 'fleet_resolve_alert' kleenest-fleet-workspace-v1.js
          grep -q 'fleet_set_route_status' supabase/migrations/20260817183000_fleet_operational_mutations_v1.sql
          grep -q 'Fleet manager permission required' supabase/migrations/20260817183000_fleet_operational_mutations_v1.sql
          grep -q 'revoke execute on function public.fleet_actor_is_manager' supabase/migrations/20260817183000_fleet_operational_mutations_v1.sql
      - name: Check Business QR scope and lifecycle contracts
        run: |
          set -euo pipefail
          grep -q 'KleenestBusinessQRStudioHardenerV1' kleenest-business-qr-studio-hardener-v1.js
          grep -q 'p_location_id:f.get('\''location'\'')||null' kleenest-business-qr-studio-hardener-v1.js
          grep -q 'business_set_qr_active' kleenest-business-qr-studio-hardener-v1.js
          grep -q 'business_delete_qr' kleenest-business-qr-studio-hardener-v1.js
          grep -q 'business_id' supabase/migrations/20260817190000_qr_business_scope_v1.sql
          grep -q 'p_location_id uuid' supabase/migrations/20260817190000_qr_business_scope_v1.sql
          grep -q 'p_location_id is not null' supabase/migrations/20260817190000_qr_business_scope_v1.sql
          grep -q 'business_id=p_business_id' supabase/migrations/20260817190000_qr_business_scope_v1.sql
          grep -q 'qr_codes_member_advanced_all' supabase/migrations/20260817190000_qr_business_scope_v1.sql
          grep -q 'kleenest-business-qr-studio-hardener-v1.js' cores/business/business-core-v8.js
      - name: Check Admin canonical mounts
        run: |
          set -euo pipefail
          grep -q 'AdminToolsDashboardV4' kleenest-admin-tools-dashboard-v4.js
          grep -q 'AdminToolsDashboardV4' kleenest-platform-admin-core-v4.js
