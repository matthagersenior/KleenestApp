<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kleenest — Find the Kleenest places nearby</title>
<meta name="application-name" content="Kleenest">
<meta name="description" content="Find the Kleenest places nearby.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#16211d;--muted:#5b6d66;--bg:#f6f9f7;--surface:#fff;--teal:#0e7c6b;--teal-deep:#0a5c4f;--teal-tint:#e4f2ee;--blue:#3e7c99;--blue-tint:#e8f1f5;--line:#d8dfdc;--danger:#c1503f;--green:#27ae60;--shadow:0 10px 30px rgba(22,33,29,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh;display:flex;justify-content:center;padding-bottom:84px}.app-card{width:100%;max-width:1040px;min-height:100vh;background:var(--surface);box-shadow:var(--shadow)}.app-main{padding:22px 18px 40px}.top-nav{display:none;padding:18px 28px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--teal-deep);font-size:1.35rem}.brand-mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff}.nav-links{display:flex;gap:6px;flex-wrap:wrap}.nav-btn{border:0;background:transparent;color:var(--muted);font-weight:700;border-radius:999px;padding:9px 13px}.card{border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;background:#fff}.accent{background:linear-gradient(135deg,var(--teal-tint),#fff);border-color:#b9ded5}.stack{display:flex;flex-direction:column;gap:16px}.primary,.secondary{border:0;border-radius:11px;padding:12px 17px;font-weight:750}.primary{background:var(--teal);color:#fff}.secondary{background:var(--blue);color:#fff}.muted{color:var(--muted)}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;background:#fff;color:var(--muted)}h1{margin:0 0 8px}@media(min-width:769px){.app-shell{padding:30px 24px}.app-card{border-radius:22px;min-height:calc(100vh - 60px)}.top-nav{display:flex}.app-main{padding:30px 32px 44px}}
</style>
</head>
<body>
<div class="app-shell"><div class="app-card">
<header class="top-nav" id="modular-top-nav"></header>
<main class="app-main" id="modular-root"><div id="modular-workspace" class="stack"><div class="card accent"><span class="badge">KLEENEST</span><h1>Find the Kleenest places nearby.</h1><p class="muted">Nearby discovery, check-ins, reviews, routes, rewards and community data in one place.</p><div><button class="primary" data-kleenest-start="maps">Open Maps</button> <button class="secondary" data-kleenest-start="route">Plan a Route</button></div></div></div></main>
</div></div>
<script src="kleenest-modular-entry.js?v=20260815-modular" data-kleenest-modular="true"></script>
<script src="kleenest-auth-launch.js?v=20260815-auth" data-kleenest-auth-launch="true"></script>
<script>
(function(){
 const start=()=>document.querySelectorAll('[data-kleenest-start]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.addEventListener('click',()=>window.KleenestAppShell?.navigate?.(b.dataset.kleenestStart==='maps'?'Maps':'Route'));});
 document.addEventListener('DOMContentLoaded',start,{once:true});
})();
</script>
</body></html>
