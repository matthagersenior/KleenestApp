<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0E7C6B">
<title>Kleenest — Find the cleanest restroom nearby</title>
<style>
:root{--ink:#16211D;--ink-soft:#5B6D66;--porcelain:#F6F9F7;--surface:#FFF;--teal:#0E7C6B;--tile-line:#D8DFDC}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--porcelain);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--tile-line);border-radius:16px;padding:18px}.muted{color:var(--ink-soft)}#modular-root{min-height:100vh}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="kleenest-supabase-runtime.js"></script>
</head>
<body>
<div id="modular-root"><section class="card"><h1>Kleenest</h1><p class="muted">Starting authoritative app shell…</p></section></div>
<script>
(function(){
 var root=document.getElementById('modular-root');
 function boot(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('Unable to load '+src))};document.head.appendChild(s)})}
 boot('kleenest-app-shell-v72.js?shell=72-'+Date.now()).catch(function(e){
  console.error('[Kleenest] shell bootstrap failed',e);
  root.innerHTML='<section class="card"><h1>Kleenest</h1><p class="muted">The authoritative app shell could not initialize.</p><button onclick="location.reload()">Retry</button></section>';
 });
})();
</script>
</body>
</html>
