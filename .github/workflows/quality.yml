name: Kleenest Quality
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js tests/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Verify required app-shell files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest sw.js capacitor.config.ts kleenest-supabase.js kleenest-supabase-runtime.js kleenest-account-lifecycle.js kleenest-account-ui.js privacy.html terms.html support.html icon-placeholder.svg; do
            test -f "$f"
          done
      - name: Verify manifest icon reference
        shell: bash
        run: |
          set -euo pipefail
          test -f icon-placeholder.svg
          grep -q 'icon-placeholder.svg' manifest.webmanifest
      - name: Run runtime smoke checks
        run: node tests/kleenest-runtime-smoke.js
      - name: Run auth contract checks
        run: node tests/auth-contract.js
      - name: Run account lifecycle/UI checks
        run: node tests/account-contract.js
      - name: Run app-shell/PWA safety checks
        run: node tests/app-shell-contract.js
