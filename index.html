<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0E7C6B">
<title>Kleenest — Find the cleanest restroom nearby</title>
<style>
:root{--ink:#16211D;--ink-soft:#5B6D66;--porcelain:#F6F9F7;--surface:#FFF;--teal:#0E7C6B;--tile-line:#D8DFDC}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--porcelain);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--tile-line);border-radius:16px;padding:18px}#modular-root{min-height:100vh}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?boot=20260817-1"></script>
<script src="kleenest-map-preloader.js?boot=20260817-1"></script>
<script src="kleenest-supabase-runtime.js?boot=20260817-1"></script>

<script src="kleenest-actions.js"></script>
<script src="kleenest-rewards.js"></script>
<script src="kleenest-rewards-history.js"></script>
<script src="kleenest-reviews.js"></script>
<script src="kleenest-promotions.js"></script>
<script src="kleenest-account.js"></script>
<script src="kleenest-business.js"></script>
<script src="kleenest-business-management.js"></script>
<script src="kleenest-ui-integration.js"></script>
<script src="kleenest-design-system-v1.js"></script>
<script src="kleenest-platform-admin-core-v3.js"></script>
<script src="kleenest-admin-v3-alias.js"></script>
<script src="kleenest-admin-v3-hotfix.js"></script>

<script src="supabase-client.js"></script>
<script src="kleenest-supabase-runtime.js"></script>
</head>
<body>
<div id="modular-root"><section class="card" id="boot-card"><h1>Kleenest</h1><p>Starting authoritative app shell…</p></section></div>
<script>
(function(){
 const root=document.getElementById('modular-root');
 const start=Date.now();
 function fail(e){console.error('[Kleenest boot]',e);root.innerHTML='<section class="card"><h1>Kleenest</h1><p>The authoritative app shell could not initialize.</p><pre style="white-space:pre-wrap">'+String(e.message||e)+'</pre><button onclick="location.reload()">Retry</button></section>'}
 const script=document.createElement('script');
 script.src='kleenest-app-shell-v72.js?shell=73-'+start;
 script.onload=function(){
   console.info('[Kleenest boot] authoritative shell loaded');
   if(!window.KleenestAppShellV72) fail(new Error('Shell script loaded but did not register KleenestAppShellV72.'));
 };
 script.onerror=function(){fail(new Error('Unable to load authoritative shell'))};
 document.head.appendChild(script);
})();
</script>
</body>
</html>
